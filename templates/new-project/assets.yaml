# Every asset needs a licence. music / vo_model / sfx also need source_url (hard gate for build/mix/check).
assets:
  - id: music-track
    kind: music
    path: media/music/track.mp3
    # fetch_url: https://...        # `promo fetch` downloads it when missing
    # sha256: ...                   # verified after download
    licence: "FILL ME IN (e.g. Pixabay Content License)"
    source_url: "https://FILL-ME-IN"
    redistributable: false
    notes: never commit the mp3
  - id: sfx-tick
    kind: sfx
    path: build/sfx/tick.wav
    licence: "CC0-1.0 (self-synthesised, no samples)"
    source_url: https://github.com/patrick-lai/promo-reel/blob/main/promo/sfx.py
    redistributable: true
    notes: generated by `promo sfx`
  # A hosted voice (vo: {engine: openrouter, model: ..., voice: ..., asset: openrouter-voice}); skills/promo-audio-route/SKILL.md
