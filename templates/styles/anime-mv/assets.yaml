# Every asset needs a licence. music / vo_model / sfx also need source_url (hard gate for build/mix/check).
# `test_only: true` = unlicensed material for an internal test: `promo check` WARNs (test-audio), the assembled video carries a
# burned-in TEST watermark, and `promo flow share` / `flow final add` refuse it. Swap in a licensed track before anything goes out.
assets:
  - id: song
    kind: music
    path: media/music/song.wav
    licence: "FILL ME IN (a licence that covers a music video sync), or: unlicensed, internal test only"
    source_url: "https://FILL-ME-IN"
    redistributable: false
    # test_only: true
    notes: never commit the audio
  - id: font-lyrics
    kind: font
    path: media/fonts/NotoSerifCJKjp-Regular.otf
    fetch_url: https://github.com/notofonts/noto-cjk/raw/main/Serif/OTF/Japanese/NotoSerifCJKjp-Regular.otf
    licence: "SIL Open Font License 1.1"
    source_url: https://github.com/notofonts/noto-cjk
    redistributable: true
    notes: publishable lyric face (the default falls back to the system's Hiragino Mincho, which is fine for local tests)
  - id: sfx-tick
    kind: sfx
    path: build/sfx/tick.wav
    licence: "CC0-1.0 (self-synthesised, no samples)"
    source_url: https://github.com/patrick-lai/promo-reel/blob/main/promo/sfx.py
    redistributable: true
    notes: generated by `promo sfx`
