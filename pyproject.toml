[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "promo-reel"
version = "0.1.0"
description = "Declarative, agent-runnable product promo-video pipeline (video + music + SFX + VO + mix + QA)."
requires-python = ">=3.10"
dependencies = ["numpy", "pillow", "scipy", "soundfile", "pyloudnorm", "librosa", "pyyaml"]

[project.optional-dependencies]
vo = ["kokoro-onnx"]
asr = ["faster-whisper"]

[project.scripts]
promo = "promo.cli:main"

[tool.setuptools]
packages = ["promo", "promo.shots"]

[tool.setuptools.package-data]
promo = ["../templates/new-project/*"]
