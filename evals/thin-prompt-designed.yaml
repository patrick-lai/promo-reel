# Thin-prompt eval cases for `promo designed eval` (promo/designed_eval.py). A case is what a person types plus the stills they attach.
# `stills` are placeholders when no real files are passed (a plan never reads pixels); `shape` decides device vs floating framing.
# `dialect` = the --dialect flag (omit it to read the prompt); `expect_dialect` = what the plan must pick; `defaults` = --default pairs;
# `expect_questions` = the exact co-spec keys still open (at most three).
# `never_in_plan`: words the plan must not contain unless the prompt or an answer already said them (invented features, numbers, URLs,
# benchmarks, and the reference's own assets).
cases:
  - id: commission-ai-e2e
    prompt: "60s promo for my AI coding crew. Go to bed. Wake up to merged PRs."
    stills:
      - {name: shot-01-v1-poster, shape: landscape}
      - {name: shot-06-still-board, shape: landscape}
      - {name: shot-12-ask-the-reviewer-v1-poster, shape: landscape}
    expect_dialect: ethereal
    defaults: {cta: "Your AI dev crew, on your Mac."}
    expect_questions: [cta, promise, audience]
    cards_include: ["Go to bed", "Wake up to merged PRs", "Your AI dev crew, on your Mac"]
    never_in_plan: ["24/7", "benchmark", "10x", "faster", "free", "secure", "enterprise", "integrates", "github", "slack", "http", "www.", ".com",
                    "smash", "clash", "sdk", "multiplayer", "%", "badge", "merged 3", "8 tasks"]

  - id: ai-coding-crew-kinetic
    prompt: "60s promo for my AI coding crew app. Go to bed, wake up to merged PRs."
    dialect: kinetic
    expect_dialect: kinetic
    stills:
      - {name: board, shape: landscape}
      - {name: review, shape: landscape}
      - {name: phone, shape: portrait}
    cards_include: ["Go to bed", "merged PRs"]
    never_in_plan: ["24/7", "benchmark", "10x", "faster", "free", "secure", "enterprise", "integrates", "github", "slack", "http", "www.", ".com",
                    "smash", "clash", "sdk", "multiplayer", "%"]

  - id: note-app-teaser
    prompt: "30s teaser for a note app. It never forgets. Two screenshots attached."
    expect_dialect: ethereal
    stills:
      - {name: editor, shape: landscape}
      - {name: sidebar, shape: square}
    cards_include: ["It never forgets"]
    never_in_plan: ["24/7", "benchmark", "ai-powered", "sync", "offline", "encrypted", "http", "www.", ".com", "smash", "clash", "%"]

  - id: trailer-words-pick-kinetic
    prompt: "45s punchy kinetic launch trailer for my board game app. Roll the dice. Win the night."
    expect_dialect: kinetic
    stills:
      - {name: lobby, shape: landscape}
      - {name: board, shape: landscape}
    cards_include: ["Roll the dice"]
    never_in_plan: ["24/7", "benchmark", "multiplayer", "http", "www.", ".com", "%", "players"]
