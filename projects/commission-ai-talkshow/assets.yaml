# Licence manifest for the talk show (every audio asset in the mix + the Live2D hosts and runtime). Nothing here is
# committed: the VO WAVs live in the Promo Video Director's folder, SFX are synthesised into build/, the Live2D files
# are fetched by `promo live2d fetch` (pins in live2d/assets.yaml; notice + credits on the two live2d_credits cards).
# Music: none. The only licensed track in the hero assets (music-491119, Pixabay "Upbeat Hip-Hop Beat") is a 98 BPM
# beat-grid edit that fights a conversational show; leaving it out keeps the VO clean. If a bed is wanted later, reuse
# music-491119 only (Pixabay Content License, not redistributable), ducked under the VO.
assets:
  - id: talkshow-vo
    kind: vo
    path: "${TALKSHOW_VO_DIR:-/workspace/videos/commission-ai-promo/talkshow}"
    licence: "Apache-2.0 (Kokoro-82M output; synthetic voices, no voice actor)"
    source_url: https://huggingface.co/hexgrad/Kokoro-82M
    redistributable: false
    notes: >-
      21 pre-rendered lines (vo/beatNN_lineNN_<host>.wav, 24 kHz mono) + lines.json with exact durations, generated by the
      Promo Video Director with Kokoro-82M v1.0 ONNX (kokoro-v1.0.onnx sha256 7d5df8ec..., voices-v1.0.bin sha256 bca610b8...,
      same files as the hero's kokoro-model / kokoro-voices assets). HIYORI = af_bella, MAO = bf_isabella. Provenance,
      pronunciation-only TTS overrides and whisper QA in that folder's LICENSE.md. Each line is sha256-pinned in promo.yaml.
  # Kokoro model + voice pack that produced the VO (entries from talkshow/LICENSE.md). Provenance only: the VO is not
  # re-synthesised here (vo.engine: files), so they are not fetched. Never commit them.
  - {id: kokoro-model, kind: vo_model, path: media/models/kokoro-v1.0.onnx, licence: Apache-2.0, source_url: "https://huggingface.co/hexgrad/Kokoro-82M",
     fetch_url: "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx",
     sha256: 7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5, redistributable: true}
  - {id: kokoro-voices, kind: vo_model, path: media/models/voices-v1.0.bin, licence: Apache-2.0, source_url: "https://huggingface.co/hexgrad/Kokoro-82M",
     fetch_url: "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin",
     sha256: bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d, redistributable: true,
     notes: "voices used: af_bella (HIYORI, en-us), bf_isabella (MAO, en-gb)"}
  - id: sfx-swell
    kind: sfx
    path: build/sfx/swell.wav
    licence: "CC0-1.0 (self-synthesised, no samples)"
    source_url: https://github.com/patrick-lai/promo-reel/blob/main/promo/sfx.py
    redistributable: true
    notes: Intro sting swell under the opening card. Generated by `promo sfx`; not fetched.
  # Live2D hosts + runtime (UX review: the models were missing from this manifest). Fetched by `promo live2d fetch`
  # from Live2D's servers into live2d/media/ (gitignored, sha256 in live2d/assets.yaml); never committed or redistributed.
  # status: draft until Patrick confirms the revenue condition: the Free Material License lets individuals and small
  # businesses (annual revenue under JPY 10 million) use Original Character sample models commercially; above that a
  # separate Live2D agreement is needed. The notice + model credits run on the two live2d_credits end cards.
  - id: live2d-hiyori
    kind: live2d_model
    path: ../../live2d/media/archives/hiyori_en.zip
    licence: "Live2D Free Material License Agreement v1.6 (2025-02-03), Live2D Original Character (s.2.1.3) + Terms of Use for Live2D Cubism Sample Data"
    source_url: https://www.live2d.com/en/learn/sample/momose-hiyori/
    licence_url: https://www.live2d.com/eula/live2d-free-material-license-agreement_en.html
    sha256: 1e4254d561f2a151562aa67036d78e17e4ffee08869b8ce10ab6052a05e2b3a4
    redistributable: false
    status: draft
    attribution: "Hiyori Momose (PRO). Illustration: Kani Biimu; Modeling: Live2D Inc."
    notes: "HIYORI host. Individual terms: no changes of any kind to the character design. Pending: JPY 10M revenue confirmation."
  - id: live2d-mao
    kind: live2d_model
    path: ../../live2d/media/archives/mao_en.zip
    licence: "Live2D Free Material License Agreement v1.6 (2025-02-03), Live2D Original Character (s.2.1.3) + Terms of Use for Live2D Cubism Sample Data"
    source_url: https://www.live2d.com/en/learn/sample/niziiro-mao/
    licence_url: https://www.live2d.com/eula/live2d-free-material-license-agreement_en.html
    sha256: c6bc527b3d8877f0735f4099b34c2b9bb17162d77b5957687839c74d374449d3
    redistributable: false
    status: draft
    attribution: "Niziiro Mao (PRO). Illustration: Live2D Inc.; Modeling: Live2D Inc."
    notes: "MAO host. Pending: JPY 10M revenue confirmation."
  - id: live2d-cubism-core
    kind: live2d_runtime
    path: ../../live2d/media/core/live2dcubismcore.min.js
    licence: "Live2D Proprietary Software License Agreement v2.1 (revised 2025-02-03); 'Redistributable Code', not redistributed here"
    source_url: https://www.live2d.com/en/sdk/download/web/
    licence_url: https://www.live2d.com/eula/live2d-proprietary-software-license-agreement_en.html
    sha256: 25ae938cb4fe282ce189b357bcc97e603d1e1f7ec78bf04150d401c23cdc792f
    redistributable: false
    notes: "Live2D Cubism Core for Web, used offline by the host renderer (live2d/render.mjs)."
