  shot-14b-dusk-r2-v1080:                                                                # S09b v4, DPR 1 dusk retake 2 (preferred)
    # Usable ranges 0-2.5 s and 3.6-7.5 s (2.7-3.5 s collapse / re-expand flicker cut). 09b uses 3.6-6.47 s only: dusk
    # Outside with the Street notice alone (3.6-4.6), Street (bright: real app behaviour) from 4.60 s (luma 55 -> 105).
    # At 0.7x the cue ("...a Street") puts the clip start at 3.6 s. Full height, x 413-1920 so the top-right Street
    # notice and the 'Caretaker bot building' pill stay in (the bottom-left Street info card is out). Scale 0.955.
    t_in: 3.6
    speed: 0.7
    cam: [0.60755, 0.5, 0.78490]
    sync: {src: 4.6, line: 2, at: 4.9}
    edge_check: false
    time_of_day: {from: dusk, to: day, at: 4.60, override: true, why: "manifest caveat: Street renders bright; luma 55 -> 105 at 4.60 s"}
  shot-14b-dusk-v1080:                                                                   # S09b v4, DPR 1 dusk retake
    # From ~2.7 s the app collapses to its normal layout (sidebar + Commander + Workshop pane), so frame the Workshop
    # pane only: x 750-1920 (pane border 748 .. frame edge), y 58-897 (the 'Caretaker bot building' pill and the
    # 'Your workshop is now a Street' toast in, the Street info card below out). Scale 1.23 (DPR 1 upscale).
    # The sidebar / Commander ('$1.84') stay out of frame. Street (bright) at 4.20 s (luma 59 -> 113): dissolve.
    cam: [0.69531, 0.44259, 0.60938]
    sync: {src: 4.2, line: 2, at: 4.9}
    speed: 0.7                # the collapse blacks the pane 2.80-3.2 s; at 0.7x the cue puts t_in at 3.2 (scene back)
    edge_check: false
    # manifest.md records a constant 'time of day: 19:30 dusk', but its own caveat says the town view still renders bright
    # (measured luma 59 -> 113 at 4.20 s), so the plan overrides it to keep the 0.4 s dissolve.
    time_of_day: {from: dusk, to: day, at: 4.20, override: true, why: "manifest caveat: Street renders bright; luma 59 -> 113 at 4.20 s"}
  shot-01-dusk-v1080: {edge_check: false}                                                # framed per segment (01b / 09a); no UI text

