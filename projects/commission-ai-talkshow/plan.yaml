    # Wider layout than shot-08 (stepper Coding..PR raised spans src x 690-1536). x 300-1545: left edge in the drawer's
    # inner margin (border 281, content 317), right edge just past 'PR raised'; y 100-992: under 'In Progress', title whole.
    # Promo mattes (panel colour): right 18 px over the left sliver of the 'Review PR' / 'Review' buttons, bottom 21 px over
    # the cut 'Pull request #432' line. Scale 1.157.
    # v4: x 310-1534 (drawer margin .. clean column right of 'PR raised', only the stepper rule crosses it), y 108-985
    # (under 'In Progress' .. a blank row); scale 1.176 so 'Checks' (17 src px) reaches 20 px. One partial promo matte:
    # right 12 px over the top 38 % only (the sliver of the 'Review PR' / '...' buttons above the stepper).
    cam: [0.48021, 0.50602, 0.6375]
    matte: {right: {px: 12, to: 0.38}}
    sync: {src: 7.8, line: 2, at: 6.02}                                                  # 'PR raised' at 7.80 s (18.9 - 11.1)
    tail_speed: 0.7                                                                      # v4: slower after PR raised (1.1 s freeze -> ~0.5 s)
    named:
