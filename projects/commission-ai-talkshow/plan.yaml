      - {name: "Checks", box: [933, 522, 1032, 556], src_px: 1080, at: 7.9}
      - {name: "Pushed", box: [1178, 522, 1278, 556], src_px: 1080, at: 7.9}
      - {name: "PR raised", box: [1414, 522, 1532, 556], src_px: 1080, at: 7.9}         # ink x 1418-1530
