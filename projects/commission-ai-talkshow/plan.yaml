# Hand-edited plan for the Direction 3 talk show ("Building in Public, episode one").
# make_spec.py reads this + the script + the VO's lines.json / WAVs and writes promo.yaml. Edit THIS file, not promo.yaml.
# Dialogue text comes from the script (Direction 3 table) and is never reworded here; a WAV whose voiced text differs
# (a line still being re-voiced) is used as a labelled PLACEHOLDER and the VO-vs-script check fails on it until it lands.
# Footage is referenced by manifest clip id only (hero footage manifest), never by path.
script: "${TALKSHOW_SCRIPT:-/workspace/promo/marketing/scripts-3-directions-v1.md}"
vo_dir: "${TALKSHOW_VO_DIR:-/workspace/videos/commission-ai-promo/talkshow}"   # lines.json + vo/*.wav (+ vo/superseded/)
fps: 30
lead_in: 1.5          # intro sting (screen card + swell) before HIYORI's first line
title_card: 4.0       # the title card cuts to the app (Workshop) this far in
gap_line: 0.20        # silence between lines inside a beat
cut_lead: 0.15        # a beat's screen cuts this long before its first line
hold: 1.5             # screen hold after each beat's last line (room: 1.5-2.5 s per beat, ~1:45 total, no time-stretch)
holds: {1: 2.0, 2: 0.333333, 8: 2.5, 9: 0.6}   # per-beat overrides (beat 1 may run long). Beat 2: 1/3 s (v6, Zen v5 S02 tail: everything after S02 moves exactly 35 frames earlier). Beat 9: 0.6 s (room-directed, UX review T5) so the
                          # street tail is trimmed and "It runs on your Mac" starts on the end card. Beat 10's hold = end card.
                          # Beat 8: 2.5 s (director-approved v3, +1.0 s): the screen holds ~1 s on the PR card after its pill
                          # reads Merged (7.70 s) and 08b gets a full beat; beat 8's VO timing is unchanged.
style: null               # promo frame style preset (livestream.STYLE_PRESETS): null/plain = v2 look; framed-glow = director's
                          # pick (accent border + glow on the app panel, HIYORI/MAO lower-thirds, navy->violet backdrop)
credits: [3.0, 3.0]   # two credit cards (UX review T6): notice + licence line, then the model credits

# ---- CAPTURE QUEUE: one line per swap. When a take lands (`promo footage add`), put its clip id here, re-run
# make_spec.py. A clip with a `profiles` entry below gets that framing/sync; without one it plays full frame from 0
# (add a profile line if it needs a push-in or a sync point).
takes:
  composer:  shot-03              # beat 2   legacy 4K take (3840 wide, DPR 2): native for the push-in; a new take must be DPR 2
  dag:       talk-dag-wide-r2-v1080 # beat 3   v5: DPR 2 wide r2 (13:38): PAY-101 + full PAY-104 / PAY-105 titles; v4: talk-dag-wide-v1080
  rail:      shot-05-v1           # beat 4   legacy 4K take (3840 wide, DPR 2): native for the push-in; a new take must be DPR 2
  chips:     shot-08-dpr2-v1080   # beat 5   DPR 2 retake (11:14), same timeline as shot-08 (PR raised at 7.80 s); old: shot-08-v1080
  needs_you: shot-10-dpr2-v1080   # beat 6
  review:    shot-12-dpr2-z179-v1080 # beat 7   v4.1: DPR 2 Z179 retake (main 4ccfa5be; bold renders, no '**'); old: shot-12-v1080 (1x)
  merged:    shot-16-prcard-tighter-v1080 # beat 8a  v6b: DPR 2 stepper + PR card (14:10), same timeline (reflow 6.50 s, pill Merged 7.70 s); v6: shot-16-prcard-tight-v1080
  landed:    shot-11-dpr2-v1080   # beat 8b  v5: DPR 2, Landed column right beside the counts (next: shot-11-dpr2-r2, ~20 px, drop-in); v4:  DPR 2 header hold: 'All done · Plan next' / '8 in this run · 8 landed' (shot-11-all8: text 9-11 px, not used)
  workshop:  shot-01-dusk-v1080   # beat 1b + 9a
  street:    shot-14b-dusk-r2-v1080 # beat 9b  v4: dusk retake 2 (preferred; 19:30, pop-up closed, full screen); alt: shot-14b-dusk-v1080, old: shot-14b-v1080

# Shot 11 legibility (stand-in for the `shot11_legible` selector on branch style-presets, until it merges). Fill in from
# the shot-11 entry in footage manifest.md once it is recorded: are all 8 cards / all 3 agent logos legible?
# null = not recorded yet -> the safe line.
shot11_legible: {cards: false, logos: false}   # v3: manifest: shot-11 (header) shows 3.5 cards; shot-11-all8 has all 8 but ids/titles 9-11 px -> the safe line (unchanged)
beat8_variants:                   # MAO's beat 8 line per legibility (texts quoted from the script; files by the VO director)
  full:   {cards: true,  logos: true,  text: "All eight tasks, three agents, all merged.", file: vo/beat08_line02_mao_full.wav}
  agents: {cards: false, logos: true,  text: "Three agents, and every task merged.",       file: vo/beat08_line02_mao_agents.wav}
  tasks:  {cards: true,  logos: false, text: "All eight tasks, merged.",                   file: vo/beat08_line02_mao_tasks.wav}
  all:    {cards: false, logos: false, text: "Every one of them, merged.",                 file: vo/beat08_line02_mao_all.wav}

# Per-clip framing / sync. cam = [cx, cy, width] (normalised; the crop takes the screen's aspect, 1440x1032 now that
# there is no chat strip). sync = {src: <clip s>, line: N, at: <s into line | end>}. A profile is keyed by clip id, or by
# role (`takes` key) so a retake with the same framing is a one-line `takes` swap.
# named = the on-screen elements a VO line names (UX review T1/T4): box = [x0, y0, x1, y1] in a `src_px`-tall frame of
# that take (measured on the real frames), at = clip time. `promo check` gates each >= 18 px cap height and fully inside
# the crop (livestream-named; min_px 0 = container, in-frame only) and WARNs when its effective scale (output px /
# source px) is > 1.0 = upscaled, soft (named-upscale). Push-ins >= 1.5x on the full source frame; prefer DPR 2 / 4K
# takes (shot-03 and shot-05-v1 are 3840x2160, DPR 2 = native 2x).
profiles:
  shot-03:                                                                               # S02, 4K: 2.67x push, scale 1.00
    cam: [0.33073, 0.76, 0.375]                                                          # v3: left edge in the gap left of the Commander panel (v2 cut the sidebar)
    # v4: no VO sync (it held the first frame 10.7 s). Static frames 0.5-1.0 s (0.7 s on screen), then the typing
    # (src 1.0-6.0) at 0.7x = 7.1 s from 8.2 s; the composer then sits with the typed text (src 6.0-11.35, caret only).
    # v4.1: t_in 0.3 (src 0.3-1.0 static = 1.0 s on screen at 0.7x) and S02 starts at 8.9 s (was 7.5): the end freeze
    # after 'No broken builds.' drops from 2.72 to ~1.0 s. 0.7x is already the floor, so no slower typing is possible.
    # v6 (Zen v5): the typing ends at src ~9.05 ('No broken builds.' done; caret only after). S02 starts at 11.05 s and
    # beat 2's hold is 1/3 s, so the cut to beat 3 comes ~1.0 s after the last keystroke (src ends ~9.73, no freeze).
    t_in: 0.3
    speed: 0.7
    named:
      - {name: "composer text", box: [600, 1980, 1080, 2016], src_px: 2160, at: 6.0}
      - {name: "composer", box: [575, 1945, 1465, 2125], src_px: 2160, at: 6.0, min_px: 0}
  shot-05-v1:                                                                            # S04, 4K: 2.67x push, scale 1.00
    speed: 0.7                                                                           # v4: 0.7x (shorter first-frame hold)
    cam: [0.54349, 0.59630, 0.32552]                                                     # v4: 4K x 1462-2712 (gap right of the panel divider .. gap left of PAY-110), y 840-1736 (PAY-103 title .. PAY-106 card bottom); scale 1.152
    sync: {src: 1.1, line: 2, at: 2.3}                                                   # PAY-103 lights as MAO names agents
    named:
      - {name: "PAY-103 title", box: [1645, 845, 2045, 877], src_px: 2160, at: 3.5}
      - {name: "PAY-104 title", box: [1645, 1089, 2045, 1121], src_px: 2160, at: 3.5}
      - {name: "PAY-106 title", box: [1645, 1577, 2045, 1609], src_px: 2160, at: 3.5}
      # Agent badges (Claude Code / Codex / Cursor) are NOT named elements: they're logo tiles with no text (no cap
      # height to measure; v2 measured tile vs glyph, 28 vs 13 px), and the v2 beat-4 line names no agent ("three
      # different AI coding agents"). `kind: logo` would FAIL livestream-named.
      - {name: "PAY-106 card", box: [1625, 1530, 2070, 1730], src_px: 2160, at: 3.5, min_px: 0}
  chips:                                                                                 # S05, role profile
    # shot-08-v1080 is the only take for now: 1.5x push = scale 1.12 (named-upscale WARN). Commission-ai's DPR 2 take
    # is the one-line `takes: chips:` swap; the same framing at 2x pixels keeps these boxes (src_px scales them).
    # v3: left edge on the drawer's clean inner margin (src x 376; v2 cut "ummary"/"odex"/"uest"), top edge under the
    # drawer title. No crop keeps BOTH edges clean with the labels >= 18 px (the drawer is 1416 src px of dense UI), so
    # promo mattes cover the 2 cut edges: right 14 px (a sliver of the 'Review PR' button) and bottom 21 px (the
    # branch line), filled with the panel's own background colour. 1.67x push, scale 1.25.
    cam: [0.49583, 0.5454, 0.6]
    matte: {right: 14, bottom: 21}
    sync: {src: 7.8, line: 2, at: 6.02}                                                  # 'PR raised' chip on "PR raised"
    named:
      - {name: "Coding", box: [725, 510, 815, 540], src_px: 1080, at: 7.9}
      - {name: "Checks", box: [953, 510, 1048, 540], src_px: 1080, at: 7.9}
      - {name: "Pushed", box: [1185, 510, 1278, 540], src_px: 1080, at: 7.9}
      - {name: "PR raised", box: [1403, 510, 1521, 540], src_px: 1080, at: 7.9}
  shot-10-dpr2-v1080:                                                                    # S06, DPR 2 (1.5x pre-framed): 1.67x push
    t_in: 1.20
    speed: 0.7                                                                           # v4: 06a/06b at 0.7x (shorter pre-click hold, slower click)
    tail_speed: 0.7                                                                      # v4: after the click (06b)
    until_src: 3.35                                                                      # v3: hold frame before the cursor reaches "Allow"
    sync_b: {src: 3.95, line: 2, at: 4.70}                                               # flip on HIYORI; click on cue
    cam: [0.68698, 0.59537, 0.6]                                                         # v4: src x 743-1895 (dotted canvas .. right of the Wave 2 cards), y 230-1056; scale 1.25
    named:
      - {name: "Needs you pill", box: [1095, 844, 1240, 873], src_px: 1080, at: 1.25}
      - {name: "Allow once", box: [1215, 975, 1340, 1000], src_px: 1080, at: 3.35}       # hover button 3.0-3.9 s; cursor on the check icon, label clear (3.2-3.6 s)
      - {name: "PAY-106 card", box: [940, 830, 1370, 1040], src_px: 1080, at: 3.35, min_px: 0}
  shot-12-dpr2-z179-v1080:                                                               # S07 v4.1, DPR 2 retake (2.0x pre-framed), static 5.5 s hold
    # The reply is one line here (wide pane): 'Approved. ... the diff stays inside src/cart/CartSummary.tsx.' spans x 21-1691.
    # Crop x 0-1318, y 0-945 (scale 1.093): the right edge sits in the word gap after 'inside' (x 1313-1323, a clear
    # column top to bottom), so no glyph is cut; 'src/cart/CartSummary.tsx.' is out of frame. Cap height 22 src px.
    # The take is static (Approved shows from frame 0), so fit_clip plays it at the 0.7x floor.
    cam: [0.34323, 0.4375, 0.68646]
    fit_clip: true
    text_check: {box: [474, 496], src_px: 1080, min_px: 24}
    named:
      - {name: "Approved line", box: [474, 496], src_px: 1080, at: 2.0}
      - {name: "1 task approved", box: [96, 570, 300, 600], src_px: 1080, at: 2.0}
  shot-12-v1080:                                                                         # S07, 1x take (kept until the DPR 2 retake lands)
    t_in: 2.0
    end_src: 6.25
    speed: 0.7                                                                           # v4: the reply streams at 0.7x (5.65 s first-frame hold -> 3.8 s)
    cam: [0.21771, 0.37222, 0.33333]
    text_check: {box: [237, 247], src_px: 1080, min_px: 24}                              # 'Approved...' + reason, 2.25x
    named:
      - {name: "Approved line", box: [237, 247], src_px: 1080, at: 2.05}
  talk-dag-wide-v1080:                                                                   # S03 v4, DPR 2 still (1.928x), widest panel crop (full height, 1506 px)
    # source x 96-1602: PAY-101 / PAY-102 cards whole on the left, the PAY-105 card text whole; the right edge sits in the
    # word gap of PAY-104's title (after 'the', x 1591-1607) so no glyph is cut; 'pricing' and the cards' icon buttons are
    # out of frame (the content needs 1605 px vs the panel's 1506 at full height). No matte.
    # v4.1 tried an edge before 'uses' (x 60-1402) for Zen X1, but it cut PAY-105 mid-word ('Promo code va|'): reverted.
    # Waiting on talk-dag-wide-r2 (wider frame, full PAY-104 / PAY-105 titles).
    cam: [0.44219, 0.5, 0.7846]
    fit_clip: true
    named:
      - {name: "PAY-101 id", box: [140, 405, 330, 465], src_px: 1080, at: 3.0}
      - {name: "PAY-105 id", box: [1085, 90, 1275, 145], src_px: 1080, at: 3.0}
      - {name: "PAY-104 id", box: [1085, 690, 1275, 750], src_px: 1080, at: 3.0}
      - {name: "PAY-104 title", box: [1085, 770, 1590, 830], src_px: 1080, at: 3.0}
      - {name: "PAY-101 title", box: [140, 480, 760, 535], src_px: 1080, at: 3.0}
  talk-dag-tight-v1080:                                                                  # S03, DPR 2 still: widest crop (1.27x), scale 0.96
    cam: [0.4133, 0.5, 0.7846]                                                           # PAY-101 card whole + the fan; PAY-104 title clipped at the right edge
    fit_clip: true            # v3: the 6.0 s take under the 8.6 s beat (new, shorter MAO line) plays at ~0.70x instead of freezing 2.6 s
    named:
      - {name: "PAY-101 id", box: [115, 246, 286, 285], src_px: 1080, at: 3.0}
      - {name: "PAY-104 id", box: [1094, 541, 1264, 580], src_px: 1080, at: 3.0}
      - {name: "dependency fan", box: [850, 56, 1070, 694], src_px: 1080, at: 3.0, min_px: 0}
  shot-16-prcard-v1080:                                                                  # S08a, DPR 2 (1.6x pre-framed)
    # 1.2x push on the full-height fit (cam w 0.7846 -> 0.654; the room's <= 1.2x cap), scale 1.15. Flip (drawer Done +
    # stepper Merged) measured at 6.50 s (frame diff); the PR card pill turns 'Merged' at 7.70 s. Synced to MAO's
    # "merged" (whisper word onset 0.76-0.84 s into "Every one of them, merged."). 08a runs to ~8.1 s so the pill shows.
    cam: [0.666, 0.417, 0.654]
    sync: {src: 6.5, line: 2, at: 0.80}
    named:
      - {name: "Done heading", box: [800, 5, 900, 45], src_px: 1080, at: 7.9}
      - {name: "Merged step label", box: [1712, 164, 1791, 192], src_px: 1080, at: 7.9}
      - {name: "Merged PR pill", box: [855, 472, 927, 498], src_px: 1080, at: 7.9}
      - {name: "PR card", box: [690, 445, 1865, 650], src_px: 1080, at: 7.9, min_px: 0}
  shot-16-prcard-tighter-v1080:                                                          # S08a v6b, DPR 2 (2.553x), stepper + PR card, scale 1.147
    # Same scenario beat as prcard-tight: stepper reflows to Done at 6.50 s, the PR pill flips Open -> Merged at 7.70 s
    # (frame diff), so the sync / tail are unchanged. The card is 1862 px wide (x 28-1890) and the panel takes at most
    # 1506 px at full height, so the card cannot be whole: crop x 20-1275 (left edge before 'Pull request' at x 26, right
    # edge after the 'Pushed' label (ends ~1266), before 'PR raised' / 'Thread' / 'Open'), y 181-1080: below the
    # pre-reflow 'Waiting for you to merge' line (ends y 180) and above nothing at the bottom; the pre-reflow chips row
    # (y 1030-1060) and the post-reflow stepper checks (y 193+) are both inside. Out of frame: the card's right part
    # ('Open' link), 'Thread' / 'Review thread', the PR raised / Merged steps. No matte.
    cam: [0.33724, 0.58398, 0.65365]
    sync: {src: 7.7, line: 2, at: 0.80}
    tail_speed: 0.85
    named:
      - {name: "Merged PR pill", box: [285, 756, 405, 786], src_px: 1080, at: 8.5}
      - {name: "PR title", box: [175, 813, 865, 855], src_px: 1080, at: 8.5}
      - {name: "Builds pass", box: [230, 950, 420, 987], src_px: 1080, at: 8.5}
  shot-16-prcard-tight-v1080:                                                            # S08a v3, DPR 2 tight PR-card take
    # The card is 1810 px wide (x 55-1865), wider than any crop that keeps the 18 px 'Merged' pill >= 18 px on the 1440
    # screen, so frame its left part. Director asked for 1.0x (<= ~1.1x with the whole card): the whole card cannot fit at >= 0.8x, and
    # at 1.0x the crop's right edge cuts 'Thread' / 'Refresh evidence' / the QA line (would need ~190 px mattes), so the
    # lowest CLEAN push is 1.15x: x 30-1282 (right edge left of 'Refresh evidence' and 'Thread'), y 116-1013 (under the
    # Thread row) + a 64 px bottom matte over the QA description line, which runs past
    # the right edge. Scale 1.15. No stepper / 'Done' heading in
    # this take (PR card only), so those named items go; the pill text flips Open -> Merged at 7.70 s (frame diff), synced
    # to MAO's "merged" (0.80 s into line 2); the card re-lays out (taller, chips appear) at 6.50 s.
    cam: [0.34167, 0.52269, 0.65208]
    matte: {bottom: 64}                                                                  # promo matte over the QA description line (runs past the right edge), panel colour
    sync: {src: 7.7, line: 2, at: 0.80}
    tail_speed: 0.85                                                                     # v4: the Merged hold plays out (0.29 s freeze -> 0)
    named:
      - {name: "Merged PR pill", box: [295, 425, 430, 455], src_px: 1080, at: 8.5}
      - {name: "PR title", box: [200, 476, 860, 512], src_px: 1080, at: 8.5}
      - {name: "PR card content", box: [55, 385, 1000, 690], src_px: 1080, at: 8.5, min_px: 0}
