# commission-ai "Horizon": the Opus-5.5-style film (docs/reference-study/2026-10-05-two-new-references.md, section B).
# Rapid cuts of surfaces, each framed so one edge is the horizon; one serif line sits on it; a held dawn card.
# Surfaces are generated NON-UI plates (ui: false semantics: no app UI in them); the three app shots are real recordings.
project: {name: commission-ai-horizon, title: "Commission-ai: Horizon"}
output: {name: horizon, resolution: 1080, fps: 30, duration: 20.0}        # 32 beats at 96 BPM
paths: {build: build, out: out}
assets: assets.yaml
footage: ../commission-ai-shared/footage/manifest.yaml
broll:
  - {id: hz-dawn,    kind: video, seconds: 4, prompt: "a planet-like curved horizon seen from orbit, thin deep blue to orange sunrise glow band above a black foreground, extremely slow camera tilt up, photoreal"}
  - {id: hz-denim,   kind: video, seconds: 4, prompt: "macro of blue denim fabric above a red floral brocade textile, a curved seam forming a horizon, slow push-in, photoreal, warm light"}
  - {id: hz-lace,    kind: video, seconds: 4, prompt: "macro of white lace doily edge curving like a planet horizon against black, slow drift, photoreal, shallow depth of field"}
  - {id: hz-sand,    kind: video, seconds: 4, prompt: "macro of rippled sand dune crest at golden hour forming a curved horizon against a dark sky, slow camera glide, photoreal"}
  - {id: hz-ink,     kind: video, seconds: 4, prompt: "macro of dark blue ink spreading in water with a curved glowing edge like an atmosphere horizon, slow motion, photoreal"}
  - {id: hz-moss,    kind: video, seconds: 4, prompt: "macro of green moss cushion edge curving like a hill horizon against a soft pale sky, slow drift, photoreal"}
  - {id: hz-agate,   kind: video, seconds: 4, prompt: "macro of a polished agate slice with a curved edge, magenta and teal banding, backlit, slow camera slide, photoreal"}
  - {id: hz-tomato,  kind: video, seconds: 4, prompt: "slow camera glide along the curved edge of a ripe tomato skin against pure black, shallow depth of field, photoreal macro"}

style:
  preset: horizon
  burst: [4, 26]
  horizon_text_style: {gap_frac: 0.012, shadow: {blur: 0.012, alpha: 0.6, dy: 0.002}}
  typography: {serif: [/Users/patricklai/promo-footage/fonts/SourceSerif4.ttf]}

music:
  asset: music-horizon-rise
  bpm: 96
  track_beat: 0.625
  track_offset: 0.0
  edit: {segments: [[0, 0, 32]], crossfade: 0.030, gains: [], silence_from_beat: 32}

timeline: {bpm: 96, beats: 32}

# One sentence across the cuts, wordless for the first 40% of the burst (reference), text only over generated plates (gate horizon-text-ui).
horizon_text:
  - {words: "Tell it",     beats: [14, 16]}
  - {words: "at night.",   beats: [16, 18]}
  - {words: "Wake up to",  beats: [18, 20]}
  - {words: "merged PRs.", beats: [20, 26]}


