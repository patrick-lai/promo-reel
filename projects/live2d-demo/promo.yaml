# Live2D talk-show prototype: two Live2D Original Character hosts beside a placeholder app screen (livestream layout).
# Prototype only: the screen is a PLACEHOLDER (no product footage, no claims). Test dialogue is Kokoro TTS.
#   promo live2d fetch                                     # Cubism Core + Hiyori + Mao from live2d.com (sha256-pinned)
#   python projects/live2d-demo/make_test_wavs.py          # test-only host WAVs -> $LIVE2D_DEMO_WAVS
#   python projects/live2d-demo/make_demo.py               # shots -> mux -> mp4 + 6-frame contact sheet + lip-lag report
project: {name: live2d-demo, title: "Live2D talk-show prototype"}
output: {name: live2d-demo, resolution: 1080, fps: 30, duration: 10.0}
paths: {build: build, out: out}
assets: assets.yaml
footage: footage/manifest.yaml

style:
  font:
    path: "${PROMO_FONT:-/usr/share/fonts/truetype/sand-box/google/Inter/Inter-VariableFont_opsz,wght.ttf}"

timeline: {bpm: 120, beats: 20}      # 20 beats at 120 BPM = 10.000 s

livestream:
  hosts_side: left                   # the whole show; default left
  move: {beat: 12, dur: 0.8}         # optional single slide to the other side, on the 01 -> 02 cut (beat 12 = 6.0 s)
  screen: {w: 1440}                  # 1440x810 = 56.25 % of the frame
  margin: 24
  keep_clear:
    - {name: app-top-right, box: [0.80, 0.0, 1.0, 0.14]}    # e.g. the app's status corner: nothing may cover it
  show_keep_clear: true              # dashed outline (placeholder screens only)
  title: "Building in public, ep. 1"
  chat:
    max_lines: 4
    lines:
      - {t: 0.8, user: kiri, text: "hi hi!"}
      - {t: 2.2, user: devon, text: "just got here"}
      - {t: 4.0, user: sam_k, text: "what are we looking at today?"}
      - {t: 5.6, user: lumen, text: "the screen is huge, nice"}
      - {t: 7.4, user: kiri, text: "ooh the hosts moved"}
      - {t: 8.8, user: ana, text: "o/"}
  hosts:
    - {id: a, model: hiyori, name: Hiyori, seed: 11, wav: "${LIVE2D_DEMO_WAVS:-/workspace/promo-reel-evals/live2d}/host_a.wav"}
    - {id: b, model: mao, name: Mao, seed: 22, wav: "${LIVE2D_DEMO_WAVS:-/workspace/promo-reel-evals/live2d}/host_b.wav"}

shots:
  - id: "01"
    beats: [0, 12]
    type: livestream
    screen: {placeholder: "APP FOOTAGE"}
  - id: "02"
    beats: [12, 20]
    type: livestream
    screen: {placeholder: "APP FOOTAGE"}

qa: {min_caption_hold: 2.0}
