# commission-ai 60 s hero v3 (v2 + Zen v2 notes; see docs/hero-v3.md): v1 structure re-cut on the v1-1080 recapture (app main 4a427fc0) + Zen's v1 notes.
# Shot order (locked): 01 02 03 04 05 06 08(+09) 10 12 15 11 16 14b 17. Shot 13 out; shot 07 dropped (see docs/hero-v2.md).
# Paths are relative to this file; ${VAR:-default} env expansion everywhere.
project: {name: commission-ai-hero, title: "commission-ai hero v3"}
output: {name: hero-v3, resolution: 1080, fps: 30, duration: 60.0}     # resolution 1080 or 2160; CLI --scale / PROMO_SCALE override
paths: {build: build, out: out}
assets: assets.yaml                       # music / vo models / sfx / font (licence gate)
footage: footage/manifest.yaml            # raw clips by id: absolute path + sha256 + provenance (footage never in git)
plugins: [shots.py]                       # project-specific shot types: composer, rail_labels, tilt_card, float_window, tiles

style:
  font:
    path: "${PROMO_FONT:-/usr/share/fonts/truetype/sand-box/google/Inter/Inter-VariableFont_opsz,wght.ttf}"
    fallbacks: ["/usr/share/fonts/truetype/inter/Inter-VariableFont_opsz,wght.ttf"]
  # v2 (Zen): captions 1.5x bigger (32 -> 48 px) in ONE fixed lower-middle zone that every captioned shot is framed to keep
  # free of UI text (shots where no framing can keep it clear carry no caption). Units: 1920x1080 canvas px.
  # NOTE: at 48 px the pills no longer fit the 9:16-safe 608 px column; a 9:16 cutdown needs its own caption size.
  caption: {cx: 960, cy: 960, size: 48, max_w: 1120, zone: {x0: 400, x1: 1520, y0: 895, y1: 1025}}

music:
  asset: music-491119
  bpm: 98
  track_beat: 0.61225          # seconds per beat in the source mp3
  track_offset: 0.0455         # track beat 0 position in the mp3
  edit:                        # [edit_beat, track_beat_from, track_beat_to]
    segments: [[0, 0, 56], [56, 8, 16], [64, 16, 32], [80, 80, 97.6]]
    crossfade: 0.030
    gains:                     # multiplied into one gain curve, in order
      - {beats: [72, 97], db: 1.0, ramp: 0.3}     # gentle lift for the biggest last section
      - {beats: [0, 16], db: 3.0}                 # lift the filtered intro so it reads as a breakdown
      - {beats: [56, 64], db: 6.0}                # ... and the breather
    silence_from_beat: 97.6

timeline: {bpm: 98, beats: 98}      # 98 beats = 60.000 s; frames(b0,b1) = round(t(b1)*fps) - round(t(b0)*fps)

# plates (v2): the v1-1080 night / morning Workshop takes behind the composer (03) and the floating window (15).
# Night still taken at 0.5 s (frame 30; the lamps light at frame 7, brief: frame 8 or later). cam crops the app header bar.
plates:
  night:   {source: shot-03-night-v1080,   t: 0.5, cam: [0.5, 0.54, 0.92], dim: 0.72, blur: 3}
  morning: {source: shot-15-morning-v1080, t: 1.0, cam: [0.5, 0.54, 0.92], dim: 0.88, blur: 3}

shots:
  - id: "01"
    beats: [0, 4]
    type: clip
    source: shot-01-dusk-v1080
    label: "v1-1080/shot-01-dusk.mov (main 4a427fc0, 19:30 dusk, DPR 1)"
    t_in: 0.25                     # frames 0-7 are the first-frame brightness dip (Y 52.9 vs 53.9); start at frame 15
    cam: [[0, 0.5, 0.565, 0.80], [end, 0.5, 0.575, 0.68]]
    overlays:
      - {type: scrim}
      - {type: text, text: commission-ai, cy: 500, size: 132, t: [0.15, 99], fade_in: 0.35}
      - {type: caption, text: "Your AI dev crew", style: light, size: 57, t: [0.40, 99], fade_in: 0.25}
    notes: "Dusk take, header bar cropped (box top at 16.5% of the frame). DPR 1 source: 1.25x -> 1.47x push (upscale, under the 1.5x WARN line)."

  - id: "02"
    beats: [4, 8]
    type: clip_tx
    source: shot-02
    label: "footage/shot-02.mov (OLD, 0a3c3acd)"
    t_in: 0.9
    speed: 2.0
    blur_tx: {at: [2.10, end], max: 4}     # Zen: the blur is a transition (< 0.4 s) into shot 03, not the whole shot
    cam: [[0, 0.5, 0.48, 0.74], [end, 0.5, 0.50, 0.64]]
    sfx:
      - {sfx: whoosh_long, at: 0.15, db: -3}
    notes: "In-app view toggle City -> Town -> Street glide at 2x; sharp until the last 0.35 s, then shutter blur 1 -> 4 frames into the cut."

  - id: "03"
    beats: [8, 16]
    type: composer
    source: shot-03
    label: "footage/shot-03.mov (OLD, 0a3c3acd) composer over the v1-1080 night Workshop plate"
    src_range: [0.7, 9.9]
    box: [0.151, 0.8875, 0.3792, 0.9824]
    tmap: {src0: 1.1, span: 8.25, dur: 3.9, end_src: 9.6}
    width: 1380
    scale_up: 0.05
    plate: night
    sfx:
      - sfx: typing
        src_runs: [{start: 1.0, step: "1/6", count: 33}, {start: 6.57, step: "1/6", count: 17}]
        db: -4

  - id: "04"
    beats: [16, 25]
    type: clip
    source: shot-04-v1080
    label: "v1-1080/shot-04.mov (main 4a427fc0, DPR 2 pre-framed 1.81x): plan lands, 8 cards pop in by wave"
    t_in: 2.65
    speed: 1.04
    cam: [[0, 0.5, 0.5, 1.0], [end, 0.5, 0.5, 0.95]]       # pre-framed DPR 2: push capped at 1.05x
    overlays:
      - {type: caption, text: "Split into 8 tasks.", t: [3.45, 99]}   # from src 6.24 s: all 8 cards (4 + 3 + 1 tickets) are on the board
    sfx:                                                     # card pops measured by frame difference (src s)
      - {sfx: tick,  src: 3.13, db: -7}
      - {sfx: tick2, src: 3.53, db: -7}
      - {sfx: tick,  src: 3.92, db: -7}
      - {sfx: tick2, src: 4.47, db: -7}
      - {sfx: tick,  src: 4.85, db: -7}
      - {sfx: tick2, src: 5.43, db: -7}
      - {sfx: tick,  src: 5.82, db: -7}
    notes: "Evidence for 8: Wave 1 '4 tickets', Wave 2 '3 tickets', Wave 3 '1 ticket' = 8 cards in frame from src 6.2 s. Wave 2/3 cards show the real 'Blocked' dependency state from 5.5 s (manifest note)."

  - id: "05"
    beats: [25, 33]
    type: clip
    source: shot-05-v1
    label: "footage/shot-05-v1.mov (OLD promo take, bc10d245, 3840x2160)"
    t_in: 0.6
    cam: [[0, 0.193, 0.28, 0.39], [4.9, 0.19, 0.275, 0.38]]     # v3: right edge stays at/after the Commander pane edge (src x 0.38) so the message actions and the pane ⋯ menu are not cut
    sfx:
      - {sfx: tick,  src: 1.1, db: -4}
      - {sfx: tick2, src: 2.1, db: -4}
      - {sfx: tick,  src: 3.1, db: -4}
    notes: "v2: the v1 rail lower-thirds (Claude Code / Codex / Cursor) are removed: they sat on top of the rail rows' own text (Zen: never over UI text). The rows show the agent logos."

  - id: "06"
    beats: [33, 38]
    type: tilt_card
    node: shot-06-still-node
    board: shot-06-still-board
    label: "shot-06-still-node.png over blurred shot-06-still-board.png (OLD, 0a3c3acd)"
    scale: [1.4, 1.58]
    tilt: [16, -2]
    overlays:
      - {type: caption, text: "Each task gets its own worktree.", t: [0.25, 99]}
    sfx:
      - {sfx: whoosh_short, at: 0.0, offset: -0.12, db: -8}
    notes: "PAY-105 TaskNode (worktree slot 'S2')."

  - id: "08"
    beats: [38, 45]
    type: clip
    source: shot-08-dpr2-v1080
    label: "v1-1080/shot-08-dpr2.mov (main 4a427fc0, DPR 2 pre-framed 2.13x): PAY-104 (Codex) Coding -> Checks -> Pushed -> PR raised (shots 8 + 9)"
    segs:
      - {t_in: 1.6, t_out: 4.9, dur: 2.6}          # Coding -> Verifying / 'Running checks' (src 2.0-4.9) = old shot 9
      - {t_in: 4.9, t_out: 8.6, dur: 1.7}          # Pushed (4.9) -> PR raised #432 (7.8)
    cam: [[0, 0.5, 0.40, 0.95], [end, 0.5, 0.40, 0.87]]     # 1.05x -> 1.15x (DPR 2 cap 1.2x), anchored to the top of the drawer
    sfx:
      - {sfx: tick,  src: 2.0, db: -3}
      - {sfx: tick2, src: 4.9, db: -5}
      - {sfx: tick,  src: 7.8, db: -4}
    notes: "No caption in v2: the fixed caption zone would sit on the drawer's 'Pull request' text at every framing up to 1.2x. The VO names the steps."

  - id: "10"
    beats: [45, 54]
    type: clip
    source: shot-10-dpr2-v1080
    label: "v1-1080/shot-10-dpr2.mov (main 4a427fc0, DPR 2 pre-framed 1.5x): PAY-106 Running -> Needs you, real click on Allow once"
    t_in: 0.4
    speed: 1.0
    cam: [[0, 0.4688, 0.5833, 0.86], [end, 0.4688, 0.5833, 0.8333]]   # 1.16x -> 1.2x, PAY-106 card + Commander 'Allow once'
    sfx:
      - {sfx: chime, src: 1.25, db: -6}
      - {sfx: tick,  src: 3.95, db: -2}
      - {sfx: tick2, src: 4.25, db: -6}
    notes: "No caption in v2: the PAY-106 'Needs you' card fills the bottom-centre of the frame at every framing, so the fixed zone would cover it. The VO names 'needs you' (chip measured >= 18 px)."

  - id: "12"
    beats: [54, 64]
    type: clip
    source: shot-12-dpr2-z179-v1080
    label: "v1-1080/shot-12-dpr2-z179.mov (main 4ccfa5be, DPR 2 pre-framed 2x, replaces shot-12-dpr2: no literal **): reviewer thread 'Approved. ...' for PR #432"
    segs:
      - {t_in: 0.0, t_out: 5.4, dur: 6.1333}       # static thread hold played at 0.88x to fill the slot
    cam: [[0, 0.5, 0.5, 1.0], [end, 0.4762, 0.4762, 0.9524]]   # top-left crop 1.0x -> 1.05x: the 10:40 PM divider lands at y 848, above the caption
    overlays:
      - {type: caption, text: "Reviewed, with the reason why.", t: [1.2, 99]}   # sits below the 10:40 PM divider (empty pane)
    notes: "1.2x top-left was asked for; on the DPR 2 take it would cut the reviewer's reason line (ends at src x 1695) and the 'PR raised' / timestamp labels, so the push stops at 1.05x."

  - id: "15"
    beats: [64, 70]
    type: float_window
    source: shot-16-prcard-v1080
    label: "v1-1080/shot-15-prcard.mov (main 4a427fc0, DPR 2 pre-framed 1.6x): PAY-110 drawer In review -> Done -> PR #438 Merged, in a window over the morning plate"
    t_in: 5.83                     # latest start that fills 3.67 s inside the 9.50 s take; badge Open -> Merged at src 7.70 (out 1.87 s)
    window: [1300, 731]
    y: 470
    plate: morning
    camA: [[0, 0.6667, 0.385, 0.646], [3.67, 0.6667, 0.385, 0.636]]   # v3: whole drawer width (src x 670-1890): PR card incl. its 'Open' link no longer clipped at the right
    camB: [[0, 0.6667, 0.385, 0.646], [3.67, 0.6667, 0.385, 0.636]]
    dissolve: [3.0, 3.2]
    # v3: no caption. Merged only holds 7.70-9.50 s of the take (1.8 s < the 2.0 s caption gate), and the 'Merged' badge is ~12 px here (< 18 px),
    # so 'Wake up to merged PRs.' moved to S16's Merged flip as VO (S16's fixed caption zone would sit on the Evidence text, so no caption there either).
    sfx:
      - {sfx: tick2, src: 6.5, db: -6}
      - {sfx: tick,  src: 7.7, db: -4}

  - id: "11"
    beats: [70, 76]
    type: clip
    label: "v1-1080/shot-11.mov (header '8 in this run · 8 landed') then shot-11-all8.mov (all 8 Done cards), main 4a427fc0, DPR 2"
    segs:
      - {source: shot-11-header-v1080, t_in: 0.25, t_out: 2.70, dur: 2.45,
         cam: [[0, 0.5833, 0.4167, 0.8333], [2.45, 0.5833, 0.4167, 0.8333]]}    # v3: held at the 1.2x cap, top-right anchored (header + Landed column)
      - {source: shot-11-all8-v1080, t_in: 1.0, t_out: 2.2167, dur: 1.2167,
         cam: [[0, 0.55, 0.5, 0.88], [1.2167, 0.55, 0.5, 0.8333]]}              # v3: all 8 cards + Plan more, 1.14x -> 1.2x
    cam: [[0, 0.5, 0.5, 1.0], [end, 0.5, 0.5, 1.0]]
    overlays:
      # claim only what the caption frame shows: '8 in this run · 8 landed' (8 tasks, all landed = 'Merged and closed').
      # The header take shows 2 agent logos (Claude, Codex; Cursor's PAY-106 logo is below the frame) -> no '3 AGENTS'.
      - {type: caption, text: "8 TASKS · ALL MERGED", t: [0.2, 2.42]}
    notes: "Caption over the header segment only (the all-8 column fills the bottom-centre, so a caption there would cover cards)."

  - id: "16"
    beats: [76, 80]
    type: clip
    source: shot-16-prcard-tight-v1080
    label: "v1-1080/shot-16-prcard-tight.mov (main 4a427fc0, DPR 2 pre-framed 2.47x): PR #438 Open -> Merged"
    t_in: 7.05
    speed: 1.0
    cam: [[0, 0.5, 0.5, 1.0], [end, 0.5, 0.5, 1.0]]        # no push-in (brief)
    sfx:
      - {sfx: swell, src: 7.7, offset: -0.9, db: -10}
      - {sfx: tick,  src: 7.7, db: -3}
    notes: "Badge flips Open -> Merged at src 7.70 s (the 6.50 s change is the stats/layout update); t_in 7.05 puts the flip 0.65 s in and holds Merged ~1.8 s. The drawer's real 'Evidence: QA decision not recorded' block shows below the card."

  - id: "14b"
    beats: [80, 90]
    type: clip
    label: "v1-1080/shot-14b-dusk-r2.mov (main 4a427fc0, 19:30 dusk, DPR 1): full-screen Outside view, then the Street glide (the 2.7-3.5 s collapse/re-expand flicker is cut)"
    segs:
      - {source: shot-14b-dusk-r2-v1080, t_in: 0.1333, t_out: 2.50, dur: 2.3667,
         cam: [[0, 0.40, 0.50, 0.80], [2.3667, 0.40, 0.50, 0.77]]}    # dusk Outside view; crop excludes the settings popover / toasts (right), top bar and HUD (bottom-left); 1.25x -> 1.3x
      - {source: shot-14b-dusk-r2-v1080, t_in: 3.70, t_out: 7.4667, dur: 3.7667,
         cam: [[0, 0.43, 0.48, 0.80], [3.7667, 0.43, 0.48, 0.78]]}    # re-expanded full-screen: Outside + Street glide; crop excludes the Street toast (top right), top bar and HUD; 1.25x -> 1.28x
    cam: [[0, 0.40, 0.50, 0.80], [end, 0.40, 0.50, 0.77]]
    overlays:
      - {type: caption, text: "Every token builds something.", style: light, t: [0.35, 99]}
    notes: "v3: r2 retake. 0-2.5 s and 3.6-7.5 s only (the toast close collapses the Workshop; it is re-expanded by a real click, flicker 2.7-3.5 s cut). Both segments are full-screen, so no 1.7x pane crop."

  - id: "17"
    beats: [90, 98]
    type: card
    bg: {source: shot-01-dusk-v1080, t: 3.5}
    label: "v1-1080/shot-01-dusk.mov frame (= shot 01), blurred"
    cam: [0.5, 0.57, 0.7]
    blur: 14
    brightness: 0.30
    plate_blend: 0.35
    push: 0.03
    overlays:
      - {type: text, text: commission-ai, cy: 470, size: 132, t: [0.0, 99], fade_in: 0.25}
      - {type: text, text: "Your AI dev crew, on your Mac.", cy: 590, size: 50, weight: Medium, t: [0.25, 99], fade_in: 0.3}
      - {type: pill, text: "macOS alpha", style: light, cy: 690, size: 32, t: [0.5, 99], fade_in: 0.3}
    notes: "End card, no URL. Music hard-stops at beat 96; the last 1.2 s holds on the card."

vo:
  engine: kokoro
  model_asset: kokoro-model
  voices_asset: kokoro-voices
  voice: bf_emma
  lang: en-gb
  speed: 0.95
  lines:                       # `at` = shot-local seconds; `text` = script (what the QA gate compares), `tts` = what Kokoro is told to say
    - {shot: "03", at: 0.35, text: "Tell it what you want built."}
    - {shot: "04", at: 0.35, text: "The Commander plans the work…", tts: "The Commander plans the work,"}
    - {shot: "05", at: 0.30, text: "…and a crew of agents picks it up.", tts: "and a crew of agents picks it up."}
    - {shot: "06", at: 0.20, text: "Each in its own worktree.", asr_aliases: {"work tree": worktree}}
    - {shot: "08", at: 0.25, text: "They code, run the checks and push.", tts: "They code, run the checks, and push."}
    - {shot: "10", at: 0.95, text: "It only asks when it needs you."}
    - {shot: "12", at: 0.50, text: "A reviewer checks each change and tells you why it passes."}   # = audio/vo/stems/vo-12-v2-bf_emma.wav (same voice/speed, deterministic)
    - {shot: "15", at: 0.40, text: "Go to bed."}
    - {shot: "16", at: 0.52, text: "Wake up to merged PRs.", tts: "Wake up to merged P R's."}   # 1.84 s line ends at 2.36 s inside the 2.43 s shot; "merged" lands just after the Open -> Merged flip (out 0.65 s)
    - {shot: "14b", at: 0.45, text: "And while they work, your workshop grows."}
    - {shot: "17", at: 0.45, text: "commission-ai. Your AI dev crew, on your Mac.", tts: "Commission AI. Your AI dev crew, on your Mac."}

sfx:
  library:
    tick: {asset: sfx-tick}
    tick2: {asset: sfx-tick2}
    chime: {asset: sfx-chime, duck_music: {db: 3, dur: 1.2}}
    whoosh_long: {asset: sfx-whoosh_long}
    whoosh_short: {asset: sfx-whoosh_short}
    swell: {asset: sfx-swell}
    key0: {asset: sfx-key0}
    key1: {asset: sfx-key1}
    key2: {asset: sfx-key2}
    key3: {asset: sfx-key3}
    key4: {asset: sfx-key4}
    key5: {asset: sfx-key5}
    typing: {variants: [key0, key1, key2, key3, key4, key5], gain_jitter: [-2.5, 1.0], pan_jitter: 0.15, seed: 3}

mix:
  sr: 48000
  bus_db: {music: -5.0, sfx: -8.0, vo: 1.5}
  vo_line_lufs: -16.0
  duck: {db: 7.0, attack: 0.12, release: 0.35, pre: 0.12, post: 0.1}
  fade_out: 0.03
  masters:
    - {name: web,    suffix: "",        lufs: -14.0, ceiling: -1.2, max_true_peak: -1.0}
    # social: hotter master, -1.8 dBTP WAV ceiling. ffmpeg's native AAC at full bandwidth overshot to -0.9 dBTP in legacy v1 (over the
    # -1 gate; lowering the ceiling made it worse); an 18 kHz encoder cutoff keeps the encoded file under -1 dBTP.
    # v2: the v2 mix overshot to -0.4 dBTP after AAC at 320k / 18 kHz; at 384k (same 18 kHz cutoff) it measures -1.4 dBTP.
    - {name: social, suffix: "-social", lufs: -9.0,  ceiling: -1.8, max_true_peak: -1.0, aac_cutoff: 18000, aac_bitrate: 384k}

qa: {min_caption_hold: 2.0, lufs_tolerance: 0.5, beat_subdivision: 1, vo_max_wer: 0.0, asr_model: small.en}
