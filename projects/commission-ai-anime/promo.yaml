# commission-ai anime opening (Direction 2, Marketing final text map). Style preset: anime-opening.
# Source of truth for words: /workspace/promo/marketing/scripts-3-directions-v1.md, Direction 2 + the final text map in
# docs/anime-v2.md. Real footage only (footage/manifest.yaml, v1-1080 takes); missing shots are labelled placeholder
# slates: swapping one in is a config change (replace `placeholder:` with `source:` + `cam:`). No URL on the end card.
# Heavy steps hold flock /tmp/commission-ai-cargo.lock (promo/lock.py) and run niced with ffmpeg -threads 2.
project: {name: commission-ai-anime, title: "commission-ai anime opening (Direction 2)"}
output: {name: anime-v11, resolution: 1080, fps: 30, duration: 76.192188}  # ends where the music master ends (76.192 s = 224.767 beats); 2286 frames, no tail pad
paths: {build: build, out: out}
assets: assets.yaml
footage: footage/manifest.yaml

# critique-pack inputs (copy + footage manifests keep the anime defaults): Zen's anime reviews go into the pack's reviews/.
critique:
  reviews: [reviews/zen-v9.md]

style:
  preset: anime-opening        # bar-snapped cuts, 1-bar UI holds, cards >= 1 bar in ONE fixed lower band, fx at cuts only
  # v6 (Zen A4): the preset band is 15% of the frame (band.frac 0.15 -> y 918-1080, 162 px; v5 was 280 px = 26%).
  # UI shots are framed in the 1920x918 area above it; card cap heights >= 18 px (gate card-band).

# edit-v1.json: 177 BPM, 221 beats (0..220), 56 bars, 8-bar phrase flags, markers. 1 bar = 4 beats = 1.3559 s.
# Timeline ends exactly at the end of the music master (76.192188 s = 224.76695 beats): the end card is trimmed, not
# padded (director v2 note 1). The video frame grid rounds the last frame to 76.200 s (2286 frames); audio ends at 76.192 s.
timeline: {grid: "${COMMISSION_AI_PROMO:-/workspace/videos/commission-ai-promo}/anime/music/edit-v1.json", beats: 224.76695}

music:
  asset: music-324102-edit-v1   # already cut + mastered on the grid: one segment from beat 0
  track_beat: 0.3389830508474576
  track_offset: 0.0
  edit: {segments: [[0, 0, 224.76695]], crossfade: 0.0, gains: []}

# Truth gate for the plan + peak cards: each card's text is picked from what its own shot legibly shows.
#  - peak (15, v8): the shot-11-dpr2-r2 take, '### Shot 11 (DPR2 r2, header 20 px + Landed column)' in manifest.md
#    ('8 in this run · 8 landed'). cards: 8 and landed: 8 from that header (21 src px x2.17 = 45 px in shot 15's crop;
#    named gate keeps it >= 18 px). logos stays null: the crop shows one card's logo, not a count of agents, so the
#    '3 AGENTS' line can never be selected (Marketing 4 Oct: '8 TASKS · ALL LANDED', word for word with '8 landed').
#  - plan (04, v7): shot-04-dpr2-promo, '### Shot 4 (DPR2 promo plan DAG)' ('fitted to the 8 cards'). cards: 8 is the
#    number of whole cards in shot 04's crop (counted on the full-res frames: Wave 1 4, Wave 2 3, Wave 3 1; every card
#    whole, nothing under the band). It is a count of cards, so no card ID is named on any card.
claims:
  legible:
    shot11_legible: {cards: 8, landed: 8, logos: null}   # shot-11-dpr2-r2 header '8 in this run · 8 landed' (45 px in 15)
    shot04p_legible: {cards: 8}                    # shot-04-dpr2-promo: 8 whole task cards in shot 04's frame
  tables:
    landed_count:              # the peak card on shot 15 (v8 copy, Marketing Lead 4 Oct; scripts-3-directions-v1.md)
      selector: shot11_legible
      evidence: {manifest: "${COMMISSION_AI_PROMO:-/workspace/videos/commission-ai-promo}/footage/v1-1080/manifest.md", section: "Shot 11 (DPR2 r2, header 20 px + Landed column)"}
      rows:
        - {cards: 8, landed: 8, text: "8 TASKS · ALL LANDED"}     # matches the header '8 in this run · 8 landed'
        - {landed: 8, text: "ALL LANDED."}
        - {text: "LANDED.", confirm: "Marketing"}                 # softened fallback, not final copy
    plan_count:                # the 12.20 s plan card: '8 TASKS.' only when shot 04's frame shows 8 whole cards
      selector: shot04p_legible
      evidence: {manifest: "${COMMISSION_AI_PROMO:-/workspace/videos/commission-ai-promo}/footage/v1-1080/manifest.md", section: "Shot 4 (DPR2 promo plan DAG)"}
      rows:
        - {cards: 8, text: "8 TASKS."}
        - {text: "THE PLAN.", confirm: "Marketing"}     # softened fallback, not final copy: Marketing to confirm

shots:
  # ---- pickup bar (0-1.36 s): dusk Workshop, text-free, held
  - id: "01"
    beats: [0, 4]
    type: anime
    ui: false
    source: shot-01-dusk
    label: "shot-01 dusk Workshop (19:30), after the first-frame brightness dip"
    t_in: 0.25                 # frames 0-7 are the brightness dip; steady from frame 8 (0.133 s)
    cam: [[0, 0.50, 0.56, 0.90]]                                # held; header bar (Workshop/Live/HD/progress) cropped out
    contact_at: 0.8
    notes: "Header bar text cropped by the camera (box top y >= 0.10). Pet cat 'zzz' bubble is real app art."

  # ---- 1.36 s intro hit: cut to the night Workshop (lamp lit) with the logo slam + a steady push-in.
  # v8 (Zen A6, Hook): 01b (the same dusk plate pushed in) is dropped, so the opening is 2 shots of the room, not 3, and
  # the first app UI (03) lands at beat 12 = 4.07 s (`promo move-cut 20 12`). 02 took over 01b's slot + its slam/fx.
  - id: "02"
    beats: [4, 12]
    type: anime
    ui: false
    source: shot-03-night
    label: "shot-03 night Workshop (22:00), lamp lit, logo slam on the intro hit"
    t_in: 0.20                 # Zen: start at frame 8 or later (lamp lit from frame 7); 0.20 s = frame 12
    cam: [[0, 0.50, 0.58, 0.88, linear], [end, 0.50, 0.58, 0.78, linear]]   # steady push-in; header cropped
    cards:
      - {row: title, text: "commission-ai", bars: [0, end]}        # slams in on the intro hit; 'end' follows move-cuts
      - {row: sub, text: "Your AI dev crew", bars: [0, end]}
    fx_in: [{kind: flash, frames: 3}, {kind: speed_lines, frames: 6}]
    contact_at: 1.5
    notes: "Script asks for a robot's light flicking on: not verified in this take (lamp is already lit at frame 7)."

  # ---- 4.07 s: the ask (6 bars; v8: first app UI at beat 12, +2 bars from the dropped 01b) on shot-03-composer-dpr2
  # (DPR 2, 720x405 CSS clip, 2.667x): the Commander composer, Access = Edits, the ask typed with REAL keystrokes.
  # Measured on the frames: placeholder 'Ask Commander anything...' until 0.333 s; line 1 'Ship the checkout revamp
  # tonight.' 0.333-3.333 s (6 frames per char = 10 chars/s, Commission-ai confirmed); Shift+Enter 3.833 s (one-frame
  # reflow, box top y 773 -> 714); line 2 'No broken builds.' 4.25-5.85 s; take ends 6.35 s with the send button lit --
  # the take is NOT sent.
  # v9 (Zen A7): no 4 s still stretch; the 1.79 s the 6-bar slot needs on top of the 6.35 s take is spread over three
  # still moments. v11 (Marketing: TONIGHT. echoes what was just typed): every keystroke now plays at exactly 1x (in v9/v10
  # the final 't' 3.433 s and '.' 3.533 s sat inside the slowed 3.40-3.80 s segment), and 'tonight.' is complete before
  # the TONIGHT. card at bar 3 (8.136 s):
  #   placeholder 0-0.333 s -> 0.76 s (typing starts at shot 0.76 s = 4.83 s)
  #   line 1 0.333-3.55 s at 1x ('.' at src 3.533 s -> shot 3.96 s = 8.03 s, i.e. ~0.1 s before the card)
  #   pause after 'tonight.' src 3.55-3.80 s -> 1.10 s (no keys; Shift+Enter is 3.833 s, in the next 1x segment)
  #   caret-only end hold after the last key (real 5.85-6.33 s, 0.48 s) -> 0.05 + 0.959 = 1.01 s
  # Shot-local events: 't' of 'tonight' 3.26 s (7.33 s), '.' 3.96 s (8.03 s), Shift+Enter 5.11 s, line 2 5.53-7.13 s
  # (9.59-11.19 s), end hold 7.13-8.14 s.
  # Swap back to a slate = replace `source:`..`named:` with the old `placeholder:` block (git 41ddc06).
  - id: "03"
    beats: [12, 36]
    type: anime
    ui: true
    source: shot-03-composer-dpr2
    label: "shot-03-composer-dpr2 (DPR 2): Commander composer, 'Ship the checkout revamp tonight.' / 'No broken builds.' typed"
    segs: [{t_in: 0.0, t_out: 0.3333333, dur: 0.76}, {t_in: 0.3333333, t_out: 3.55, dur: 3.2166667},
           {t_in: 3.55, t_out: 3.80, dur: 1.10}, {t_in: 3.80, t_out: 5.90, dur: 2.10},
           {t_in: 5.90, t_out: 6.33, dur: 0.9589265}]
    # v9 (Zen A7): held at 1.59x (no zoom), panned DOWN as far as the take allows: crop src x 357-1565 (inside the gaps
    # either side of the Commander pane borders 348 / 1571), y 502.6-1080 (the take's bottom edge; the composer sits at
    # the bottom of the 720x405 CSS clip, so it cannot go lower without more zoom). Composer box (src y 714-1028 after
    # Shift+Enter) -> viewport y 336-836 of 918, centre 586 = inside the middle third (306-612); both typed lines
    # (viewport y 416-472 / 510-553) sit in the middle third. Empty pane above: viewport y 0-336 (37% of the picture,
    # was 41-44% in v8). The pane's bottom border + 20 src px of window background are the bottom 36 px; nothing under the band.
    cam: [[0, 0.50052, 0.7327, 0.62893]]
    named:                     # the typed ask (after Shift+Enter): >= 20 px target
      - {name: "typed ask line 1 'Ship the checkout revamp tonight.'", box: [410, 755, 1100, 806], t: 7.5}
      - {name: "typed ask line 2 'No broken builds.'", box: [410, 815, 1000, 858], t: 7.5}
    cards:                     # v10 copy (Marketing Lead, Zen v9 condition): ONE ASK. 4.07-8.14 s, TONIGHT. 8.14-12.20 s (3 bars each)
      - {row: title, text: "ONE ASK.", bars: [0, 3]}      # from the first UI frame, while the ask types (typing from 5.17 s)
      - {row: title, text: "TONIGHT.", bars: [3, 6]}      # v11: 'tonight.' complete at ~8.03 s, the card echoes it at 8.14 s
    fx_in: {kind: flash, frames: 3}
    contact_at: 5.6
    notes: "Real keystrokes at the captured 10 chars/s, not sent in the take (send button lit at the end); no card claims a send."

  # ---- 12.20 s: plan (4 bars) on shot-04-dpr2-promo (DPR 2, ?demo=promo, 1006x566 CSS clip, 1.909x): the plan of 8 as a
  # DAG. Wave 1 (4 cards) Ready, Waves 2 (3) and 3 (1) with the app's real Blocked padlock. Zen (v7 A2): it still reads as
  # the start of the run after the first card goes Running, because the other seven are still Ready or Blocked, so the
  # card holds through that flip. Measured on the full-res frames: cards animate into place 0-0.40 s (PAY-104/105
  # overlap) and are settled from 0.43 s; first card Running at 0.733 s; the SECOND card goes Running at 1.733 s, so the
  # take is only used up to 1.70 s. The settled board is static apart from the flip, so the Ready state holds 2 bars
  # (0.45-0.733 s stretched; identical frames), the flip plays real time ON bar 2, then the Running state holds 2 bars.
  - id: "04"
    beats: [36, 52]
    type: anime
    ui: true
    source: shot-04-dpr2-promo
    label: "shot-04-dpr2-promo (DPR 2): the plan of 8 as a DAG, Wave 1 Ready -> first card Running, Waves 2/3 Blocked"
    segs: [{t_in: 0.45, t_out: 0.7333333, dur: 2.7118644}, {t_in: 0.7333333, t_out: 0.90, dur: 0.1666667},
           {t_in: 0.90, t_out: 1.70, dur: 2.5451977}]
    # 1:1 (no upscale): the 8 cards span src x 67-1516, y 141-1043 (903 px) and the band-layout viewport is 1920x918, so
    # crop src x 0-1920, y 133-1051 (cy 0.548148, ~8 px above and below the card stack). The Wave
    # 1/2/3 headings + 'Ready to start' / '1 running · 3 queued' lines (src y 45-110) sit wholly above the crop, so no
    # line is cut; every card is whole and nothing is under the band. IDs stay 16 px (not named on any card).
    cam: [[0, 0.5, 0.548148, 1.0]]
    named:                     # the 8 cards the '8 TASKS.' card counts (claims.plan_count): titles >= 18 px, none under the band
      - {name: "top-left card title (Wave 1, first card)", box: [80, 200, 472, 234], t: 1.0}
      - {name: "bottom-left card title, 2nd line (lowest text in frame)", box: [80, 934, 472, 967], t: 1.0}
      - {name: "Wave 3 card title (Remove legacy pricing module)", box: [1118, 200, 1505, 234], t: 1.0}
    cards:
      - {row: title, text_from: claims.plan_count, bars: [0, 4]}
    contact_at: 1.0
    notes: "The card's 8 is the count of whole task cards in frame (claims.plan_count via shot04p_legible.cards). No IDs on cards."

  # ---- 17.63 s lift: roll call, 2 bars each (real board-card logos, frozen frame of shot-10-dpr2 before Needs you)
  - id: "05"
    beats: [52, 60]
    type: anime
    ui: true
    source: shot-10-dpr2
    freeze: 0.20
    label: "shot-10-dpr2 frozen at 0.20 s: PAY-103 card with the Claude Code logo"
    # v6 (A4): crop y 2-332 -> 15-318, bottom edge in the gap between PAY-103 (ends src y 323) and PAY-104 (starts 352):
    # no card cut by the band. x 799-1490 -> 827-1461 keeps the Wave 2 titles (x >= 1490) out.
    cam: [[0, 0.596, 0.1542, 0.36], [end, 0.596, 0.1542, 0.33]]
    cards:
      - {row: title, text: "CLAUDE CODE", bars: [0, 2]}
      - {row: sub, text: "on the job", bars: [0, 2]}
    fx_in: [{kind: flash, frames: 3}, {kind: speed_lines, frames: 6}]
    contact_at: 1.4
    notes: "Name from the capture manifest (shot 10: 'PAY-103 Claude Code logo'); the card shows the logo, not the word."
  - id: "06"
    beats: [60, 68]
    type: anime
    ui: true
    source: shot-10-dpr2
    freeze: 0.20
    label: "shot-10-dpr2 frozen at 0.20 s: PAY-104 card with the Codex logo"
    # v6 (A4): PAY-104 + PAY-105 whole: crop y 328-815 -> 340-803, top/bottom edges in the card gaps (323-352, 791-821)
    cam: [[0, 0.602, 0.5292, 0.53], [end, 0.602, 0.5292, 0.505]]
    cards:
      - {row: title, text: "CODEX", bars: [0, 2]}
      - {row: sub, text: "on the job", bars: [0, 2]}
    fx_in: [{kind: flash, frames: 3}, {kind: speed_lines, frames: 6}]
    contact_at: 1.4
    notes: "Logo per capture manifest; shot-08 spells 'Codex · Board run' for PAY-104."
  - id: "07"
    beats: [68, 76]
    type: anime
    ui: true
    source: shot-10-dpr2
    freeze: 0.20
    label: "shot-10-dpr2 frozen at 0.20 s: PAY-106 card with the Cursor logo"
    # v6 (A4): PAY-105 + PAY-106 whole: crop y 566-1071 -> 580-1057, top edge in the 557-587 gap (v5 cut 'endpoint')
    cam: [[0, 0.602, 0.7579, 0.55], [end, 0.602, 0.7579, 0.52]]
    cards:
      - {row: title, text: "CURSOR", bars: [0, 2]}
      - {row: sub, text: "on the job", bars: [0, 2]}
    fx_in: [{kind: flash, frames: 3}, {kind: speed_lines, frames: 6}]
    contact_at: 1.4
    notes: "Logo per capture manifest (shot 10: 'PAY-106 Cursor logo', Commander card says 'Answer Cursor')."

  # ---- 25.76 s: montage A, the exact chip words, 2 bars each (shot-08-dpr2 PAY-104 drawer, Codex; 2.13x pre-framed,
  # whole stepper in frame). Push in on the active stepper chip. Same scenario timings as shot-08.
  # v6 (A4): centre y 470 (cy 0.4352) for 1.61x -> 1.85x: crop top stays in the 160-253 gap (below the task title) and
  # the bottom in the gap after 'Codex · Board run' (y 625-698) for every frame of the push, so no line is ever cut by the
  # band; 08 sits at cx 0.456 so the board sliver ('Wave 1 / Starts after', x < 280) stays out.
  - id: "08"
    beats: [76, 84]
    type: anime
    ui: true
    source: shot-08-dpr2
    label: "shot-08-dpr2 PAY-104 drawer: Running / Coding chip"
    segs: [{t_in: 0.0, t_out: 1.95, dur: 2.7118644}]
    cam: [[0, 0.456, 0.4352, 0.62, linear], [end, 0.456, 0.4352, 0.54, linear]]   # v6 (A4): crop edges stay in text gaps for the whole push
    named:                     # the chip label the card names: >= 18 px cap height (gate `named`; upscale WARNs)
      - {name: "Coding chip label", box: [680, 555, 792, 592]}
    cards: [{row: title, text: "CODING.", bars: [0, 2]}]
    fx_in: {kind: flash, frames: 3}
    contact_at: 1.4
  - id: "09"
    beats: [84, 92]
    type: anime
    ui: true
    source: shot-08-dpr2
    label: "shot-08-dpr2 PAY-104 drawer: Verifying / Checks chip"
    segs: [{t_in: 2.0, t_out: 4.85, dur: 2.7118644}]
    cam: [[0, 0.511, 0.4352, 0.62, linear], [end, 0.511, 0.4352, 0.54, linear]]   # v6 (A4): crop edges stay in text gaps for the whole push
    named:                     # the chip label the card names: >= 18 px cap height (gate `named`; upscale WARNs)
      - {name: "Checks chip label", box: [925, 518, 1040, 550]}
    cards: [{row: title, text: "CHECKS.", bars: [0, 2]}]
    fx_in: {kind: flash, frames: 3}
    contact_at: 1.4
  - id: "10"
    beats: [92, 100]
    type: anime
    ui: true
    source: shot-08-dpr2
    label: "shot-08-dpr2 PAY-104 drawer: In review / Pushed chip"
    segs: [{t_in: 4.95, t_out: 7.75, dur: 2.7118644}]
    cam: [[0, 0.640, 0.4352, 0.62, linear], [end, 0.640, 0.4352, 0.54, linear]]   # v6 (A4): crop edges stay in text gaps for the whole push
    named:                     # the chip label the card names: >= 18 px cap height (gate `named`; upscale WARNs)
      - {name: "Pushed chip label", box: [1170, 522, 1285, 552]}
    cards: [{row: title, text: "PUSHED.", bars: [0, 2]}]
    fx_in: {kind: flash, frames: 3}
    contact_at: 1.4
  - id: "11"
    beats: [100, 108]
    type: anime
    ui: true
    source: shot-08-dpr2
    label: "shot-08-dpr2 PAY-104 drawer: PR raised #432 chip"
    segs: [{t_in: 7.85, t_out: 9.20, dur: 2.7118644}]
    cam: [[0, 0.768, 0.4352, 0.62, linear], [end, 0.768, 0.4352, 0.54, linear]]   # v6 (A4): crop edges stay in text gaps for the whole push
    named:                     # the chip label the card names: >= 18 px cap height (gate `named`; upscale WARNs)
      - {name: "PR raised chip label", box: [1405, 521, 1545, 552]}
    cards: [{row: title, text: "PR RAISED.", bars: [0, 2]}]
    fx_in: {kind: flash, frames: 3}
    contact_at: 1.4

  # ---- 36.60 s: needs you (6 bars), slow push on PAY-106
  - id: "12"
    beats: [108, 132]
    type: anime
    ui: true
    source: shot-10-dpr2
    label: "shot-10-dpr2: PAY-106 Running -> Needs you -> Allow once -> Running"
    segs: [{t_in: 0.20, t_out: 6.15, dur: 8.1355932}]       # flip at out 1.42 s, click 5.09 s, Running 5.50 s
    cam: [[0, 0.50, 0.70, 0.75], [end, 0.56, 0.82, 0.58]]
    cards: [{row: title, text: "...ONLY WHEN IT NEEDS YOU.", bars: [2, 6]}]
    contact_at: 4.5
    notes: "Card appears 1.3 s after 'Needs you' is on screen; no $ figure in this DPR2 frame."

  # ---- 44.75 s peak: hero UI montage (16 bars) ----
  - id: "13"
    beats: [132, 152]          # v6: +1 bar from the shortened shot 15 (more time to read the reason)
    type: anime
    ui: true
    source: shot-12-dpr2-z179  # DPR 2 retake, no raw '**' (main 4ccfa5be); full width above the band (no pillars)
    label: "shot-12-dpr2-z179 (DPR 2): reviewer thread 'Approved. ...' for PR #432, full width"
    segs: [{t_in: 0.80, t_out: 5.45, dur: 6.7796610}]
    # src x 0-1856 (drops the 3 px border + sliver of the next pane at x >= 1858), y ~35-808 (Cursor tab -> 10:40 PM divider)
    cam: [[0, 0.48333, 0.3904, 0.96667]]
    ui_text:
      - [0.010, 0.435, 0.885, 0.466]     # reviewer's 'Approved. Cart summary uses the pricing engine matches the plan ...'
    named:
      - {name: "reviewer 'Approved.' line", box: [15, 468, 1700, 505]}
    cards: [{row: title, text: "REVIEWED, WITH THE REASON WHY.", bars: [0, 5]}]
    fx_in: {kind: flash, frames: 3}
    contact_at: 2.5
    notes: "Director v2 note 4: 'Approved. ...' and its reason read; card in the band, never over the line."
  - id: "14"
    beats: [152, 168]          # v6: +1 bar (the Merged payoff lingers) from the shortened shot 15
    type: anime
    ui: true
    source: shot-16-prcard-tighter   # DPR 2, 752x423 CSS clip (2.553x): Done stepper + PAY-110 PR card, Open -> Merged
    label: "shot-16-prcard-tighter (DPR 2): Done stepper + PAY-110 pull request card, Open -> Merged"
    # v7, measured on full-res 1920 frames of this take: the drawer reflows to Done at frame 390 = 6.500 s (card jumps up
    # ~100 px and is whole from then on; before it the card's Builds pass row is cut off the bottom of the take) and the
    # badge text flips Open -> Merged at frame 462 = 7.700 s (hard flip). Same timing as the -tight take, so the same
    # segs: start 6.52 s (card whole), flip lands at shot 1.18 s, 6 frames before the 'MERGED.' card on bar 1 (1.356 s);
    # real time to just after the flip, then the static Merged hold at 0.4x fills the 3 bars.
    segs: [{t_in: 6.52, t_out: 7.75, dur: 1.23}, {t_in: 7.75, t_out: 9.44, dur: 4.1937288}]
    # 1:1 hold, no push: the card spans src x 25-1893 (1869 of 1920 px), so there is no room to push in without cutting
    # it; at 1.0x the Merged cap is 20 px native (src rows 761-780). Viewport 1920x918 (band layout): crop src y 125-1043
    # (cy 0.5407): the 'Done' status row (icon ends y 107) is wholly above it, the stepper + 'Codex · Board run' + the
    # whole card (y 715-1031) are inside, 12 px to spare at the bottom; nothing under the band. Evidence is out of the take.
    cam: [[0, 0.5, 0.5407, 1.0]]
    named:                     # measured while 'MERGED.' is up
      - {name: "PR card title (PAY-110 Remove legacy pricing module)", box: [175, 810, 860, 846], t: 2.0}
      - {name: "PR badge 'Merged' (the flip)", box: [288, 752, 402, 781], t: 2.0}
      - {name: "PR card 'Builds pass · 1 approval' line", box: [195, 948, 655, 988], t: 2.0}
    cards: [{row: title, text: "MERGED.", bars: [1, 4]}]     # no PR number on any card
    fx_in: {kind: flash, frames: 3}
    contact_at: 2.0
    notes: "PR number #438 is visible in the app frame (real UI), never in a card."
  - id: "15"
    beats: [168, 176]          # v6 (Zen A3): 2 bars = 2.71 s
    type: anime
    ui: true
    source: shot-11-dpr2-r2    # DPR 2, 800x450 CSS clip (2.4x): header '8 in this run · 8 landed' + the Landed column
