# commission-ai anime opening (Direction 2, Marketing final text map). Style preset: anime-opening.
# Source of truth for words: /workspace/promo/marketing/scripts-3-directions-v1.md, Direction 2 + the final text map in
# docs/anime-v2.md. Real footage only (footage/manifest.yaml, v1-1080 takes); missing shots are labelled placeholder
# slates: swapping one in is a config change (replace `placeholder:` with `source:` + `cam:`). No URL on the end card.
# Heavy steps hold flock /tmp/commission-ai-cargo.lock (promo/lock.py) and run niced with ffmpeg -threads 2.
project: {name: commission-ai-anime, title: "commission-ai anime opening (Direction 2)"}
output: {name: anime-v5, resolution: 1080, fps: 30, duration: 76.192188}  # ends where the music master ends (76.192 s = 224.767 beats); 2286 frames, no tail pad
paths: {build: build, out: out}
assets: assets.yaml
footage: footage/manifest.yaml

style:
  preset: anime-opening        # bar-snapped cuts, 1-bar UI holds, cards >= 1 bar in ONE fixed lower-third band, fx at cuts only

# edit-v1.json: 177 BPM, 221 beats (0..220), 56 bars, 8-bar phrase flags, markers. 1 bar = 4 beats = 1.3559 s.
# Timeline ends exactly at the end of the music master (76.192188 s = 224.76695 beats): the end card is trimmed, not
# padded (director v2 note 1). The video frame grid rounds the last frame to 76.200 s (2286 frames); audio ends at 76.192 s.
timeline: {grid: "${COMMISSION_AI_PROMO:-/workspace/videos/commission-ai-promo}/anime/music/edit-v1.json", beats: 224.76695}

music:
  asset: music-324102-edit-v1   # already cut + mastered on the grid: one segment from beat 0
  track_beat: 0.3389830508474576
  track_offset: 0.0
  edit: {segments: [[0, 0, 224.76695]], crossfade: 0.0, gains: []}

# Truth gate for the plan + peak cards: text is picked from what the shot-11 header take legibly shows. Evidence is the
# '### Shot 11 (header counts)' entry of manifest.md ('8 in this run · 8 landed'), NOT shot-11-all8 (its card text is
# ~9-11 px). cards: 8 is recorded because the header digits measure 17 src px x1.19-1.28 = 20.2-21.8 px in shot 04's crop
# (named gate on shot 04 keeps that >= 18 px). logos stays null: no legible logo count in the header take.
claims:
  legible:
    shot11_legible: {cards: 8, logos: null}        # shot-11 header '8 in this run · 8 landed' (>= 18 px in shot 04's crop)
  tables:
    merged_count:              # reusable selector: the hero caption uses the same table
      selector: shot11_legible
      evidence: {manifest: "${COMMISSION_AI_PROMO:-/workspace/videos/commission-ai-promo}/footage/v1-1080/manifest.md", section: "Shot 11 (header counts)"}
      rows:
        - {cards: 8, logos: 3, text: "8 TASKS · 3 AGENTS · ALL MERGED"}
        - {logos: 3, text: "3 AGENTS · ALL MERGED"}
        - {cards: 8, text: "8 TASKS · ALL MERGED"}
        - {text: "ALL MERGED."}
    plan_count:                # the 12.20 s plan card: '8 TASKS.' only when the shot-11 full board legibly shows 8 cards
      selector: shot11_legible
      evidence: {manifest: "${COMMISSION_AI_PROMO:-/workspace/videos/commission-ai-promo}/footage/v1-1080/manifest.md", section: "Shot 11 (header counts)"}
      rows:
        - {cards: 8, text: "8 TASKS."}
        - {text: "THE PLAN.", confirm: "Marketing"}     # softened fallback, not final copy: Marketing to confirm

shots:
  # ---- pickup bar (0-1.36 s): dusk Workshop, text-free, held
  - id: "01"
    beats: [0, 4]
    type: anime
    ui: false
    source: shot-01-dusk
    label: "shot-01 dusk Workshop (19:30), after the first-frame brightness dip"
    t_in: 0.25                 # frames 0-7 are the brightness dip; steady from frame 8 (0.133 s)
    cam: [[0, 0.50, 0.56, 0.90]]                                # held; header bar (Workshop/Live/HD/progress) cropped out
    contact_at: 0.8
    notes: "Header bar text cropped by the camera (box top y >= 0.10). Pet cat 'zzz' bubble is real app art."

  # ---- 1.36 s intro hit: logo slam + a steady push-in starts on the same dusk plate (continuous source + framing, so
  # the cut on the marker is invisible: the hit reads as the push starting), 1 bar
  - id: "01b"
    beats: [4, 8]
    type: anime
    ui: false
    source: shot-01-dusk
    label: "shot-01 dusk Workshop, steady push-in from the intro hit"
    t_in: 1.6166667            # = 0.25 + 41 frames: continues shot 01 frame-exactly
    cam: [[0, 0.50, 0.56, 0.90, linear], [end, 0.50, 0.565, 0.84, linear]]
    cards:
      - {row: title, text: "commission-ai", bars: [0, 1], fade_out: 0}
      - {row: sub, text: "Your AI dev crew", bars: [0, 1], fade_out: 0}
    fx_in: [{kind: flash, frames: 3}, {kind: speed_lines, frames: 6}]
    contact_at: 0.9

  # ---- 2.71 s next bar: cut to the night Workshop (lamp lit), push continues; the logo card carries over (no re-slam)
  - id: "02"
    beats: [8, 20]
    type: anime
    ui: false
    source: shot-03-night
    label: "shot-03 night Workshop (22:00), lamp lit"
    t_in: 0.20                 # Zen: start at frame 8 or later (lamp lit from frame 7); 0.20 s = frame 12
    cam: [[0, 0.50, 0.58, 0.88, linear], [end, 0.50, 0.58, 0.76, linear]]   # steady push-in; header cropped
    cards:
      - {row: title, text: "commission-ai", bars: [0, 3], slam: false}
      - {row: sub, text: "Your AI dev crew", bars: [0, 3]}
    contact_at: 2.0
    notes: "Script asks for a robot's light flicking on: not verified in this take (lamp is already lit at frame 7)."

  # ---- 6.78 s: the ask (4 bars) -- composer take not in v1-1080
  - id: "03"
    beats: [20, 36]
    type: anime
    ui: true
    placeholder:
      id: S3 composer
      label: "Composer typing 'Ship the checkout revamp tonight.' + smash-zoom on Send"
      expects: "No composer take in v1-1080 (v1-1080 shot-03 is the night Workshop).\nReal sent ask exists in shot-10-dpr2 (Commander thread, top-left) as a fallback."
    cards:
      - {row: title, text: "ONE ASK.", bars: [0, 2]}
      - {row: title, text: "TONIGHT.", bars: [2, 4]}
    fx_in: {kind: flash, frames: 3}
    contact_at: 1.0

  # ---- 12.20 s: plan (4 bars) on the shot-11 header take (DPR 2): 'All done · Plan next' / '8 in this run · 8 landed' +
  # the top of the Landed column. Static 3.0 s hold played at 0.55x under a slow push; header digits 17 src px.
  - id: "04"
    beats: [36, 52]
    type: anime
    ui: true
    source: shot-11
    label: "shot-11 (DPR 2): board header 'All done · Plan next · 8 in this run · 8 landed' + Landed column"
    segs: [{t_in: 0.10, t_out: 2.95, dur: 5.4237288}]
    cam: [[0, 0.60, 0.25, 0.84], [end, 0.60, 0.25, 0.78]]     # crop src x ~346-1920 -> 403-1901, y 0-; search box cropped
    named:                     # the count the '8 TASKS.' card rests on (claims.plan_count): must read >= 18 px
      - {name: "header count '8 in this run · 8 landed'", box: [845, 45, 1110, 95]}
      - {name: "header pill 'All done · Plan next'", box: [560, 45, 815, 95]}
    cards:
      - {row: title, text_from: claims.plan_count, bars: [0, 4]}
    contact_at: 1.0
    notes: "The card's 8 is the header's '8 in this run · 8 landed' (claims.plan_count via shot11_legible.cards)."

  # ---- 17.63 s lift: roll call, 2 bars each (real board-card logos, frozen frame of shot-10-dpr2 before Needs you)
  - id: "05"
    beats: [52, 60]
    type: anime
    ui: true
    source: shot-10-dpr2
    freeze: 0.20
    label: "shot-10-dpr2 frozen at 0.20 s: PAY-103 card with the Claude Code logo"
    cam: [[0, 0.60, 0.205, 0.44], [end, 0.60, 0.205, 0.38]]
    cards:
      - {row: title, text: "CLAUDE CODE", bars: [0, 2]}
      - {row: sub, text: "on the job", bars: [0, 2]}
    fx_in: [{kind: flash, frames: 3}, {kind: speed_lines, frames: 6}]
    contact_at: 1.4
    notes: "Name from the capture manifest (shot 10: 'PAY-103 Claude Code logo'); the card shows the logo, not the word."
  - id: "06"
    beats: [60, 68]
    type: anime
    ui: true
    source: shot-10-dpr2
    freeze: 0.20
    label: "shot-10-dpr2 frozen at 0.20 s: PAY-104 card with the Codex logo"
    cam: [[0, 0.60, 0.42, 0.44], [end, 0.60, 0.42, 0.38]]
    cards:
      - {row: title, text: "CODEX", bars: [0, 2]}
      - {row: sub, text: "on the job", bars: [0, 2]}
    fx_in: [{kind: flash, frames: 3}, {kind: speed_lines, frames: 6}]
    contact_at: 1.4
    notes: "Logo per capture manifest; shot-08 spells 'Codex · Board run' for PAY-104."
  - id: "07"
    beats: [68, 76]
    type: anime
    ui: true
    source: shot-10-dpr2
    freeze: 0.20
    label: "shot-10-dpr2 frozen at 0.20 s: PAY-106 card with the Cursor logo"
    cam: [[0, 0.60, 0.855, 0.44], [end, 0.60, 0.855, 0.38]]
    cards:
      - {row: title, text: "CURSOR", bars: [0, 2]}
      - {row: sub, text: "on the job", bars: [0, 2]}
    fx_in: [{kind: flash, frames: 3}, {kind: speed_lines, frames: 6}]
    contact_at: 1.4
    notes: "Logo per capture manifest (shot 10: 'PAY-106 Cursor logo', Commander card says 'Answer Cursor')."

  # ---- 25.76 s: montage A, the exact chip words, 2 bars each (shot-08-dpr2 PAY-104 drawer, Codex; 2.13x pre-framed,
  # whole stepper in frame). Push in on the active stepper chip. Same scenario timings as shot-08.
  - id: "08"
    beats: [76, 84]
    type: anime
    ui: true
    source: shot-08-dpr2
    label: "shot-08-dpr2 PAY-104 drawer: Running / Coding chip"
    segs: [{t_in: 0.0, t_out: 1.95, dur: 2.7118644}]
    cam: [[0, 0.383, 0.4167, 0.62, linear], [end, 0.383, 0.4167, 0.54, linear]]   # steady push on the active 'Coding' chip
    named:                     # the chip label the card names: >= 18 px cap height (gate `named`; upscale WARNs)
      - {name: "Coding chip label", box: [680, 555, 792, 592]}
    cards: [{row: title, text: "CODING.", bars: [0, 2]}]
    fx_in: {kind: flash, frames: 3}
    contact_at: 1.4
  - id: "09"
    beats: [84, 92]
    type: anime
    ui: true
    source: shot-08-dpr2
    label: "shot-08-dpr2 PAY-104 drawer: Verifying / Checks chip"
    segs: [{t_in: 2.0, t_out: 4.85, dur: 2.7118644}]
    cam: [[0, 0.511, 0.4167, 0.62, linear], [end, 0.511, 0.4167, 0.54, linear]]   # steady push on the active 'Checks' chip
    named:                     # the chip label the card names: >= 18 px cap height (gate `named`; upscale WARNs)
      - {name: "Checks chip label", box: [925, 518, 1040, 550]}
    cards: [{row: title, text: "CHECKS.", bars: [0, 2]}]
    fx_in: {kind: flash, frames: 3}
    contact_at: 1.4
  - id: "10"
    beats: [92, 100]
    type: anime
    ui: true
    source: shot-08-dpr2
    label: "shot-08-dpr2 PAY-104 drawer: In review / Pushed chip"
    segs: [{t_in: 4.95, t_out: 7.75, dur: 2.7118644}]
    cam: [[0, 0.640, 0.4167, 0.62, linear], [end, 0.640, 0.4167, 0.54, linear]]   # steady push on the active 'Pushed' chip
    named:                     # the chip label the card names: >= 18 px cap height (gate `named`; upscale WARNs)
      - {name: "Pushed chip label", box: [1170, 522, 1285, 552]}
    cards: [{row: title, text: "PUSHED.", bars: [0, 2]}]
    fx_in: {kind: flash, frames: 3}
    contact_at: 1.4
  - id: "11"
    beats: [100, 108]
    type: anime
    ui: true
    source: shot-08-dpr2
    label: "shot-08-dpr2 PAY-104 drawer: PR raised #432 chip"
    segs: [{t_in: 7.85, t_out: 9.20, dur: 2.7118644}]
    cam: [[0, 0.768, 0.4167, 0.62, linear], [end, 0.768, 0.4167, 0.54, linear]]   # steady push on the active 'PR raised' chip
    named:                     # the chip label the card names: >= 18 px cap height (gate `named`; upscale WARNs)
      - {name: "PR raised chip label", box: [1405, 521, 1545, 552]}
    cards: [{row: title, text: "PR RAISED.", bars: [0, 2]}]
    fx_in: {kind: flash, frames: 3}
    contact_at: 1.4

  # ---- 36.60 s: needs you (6 bars), slow push on PAY-106
  - id: "12"
    beats: [108, 132]
    type: anime
    ui: true
    source: shot-10-dpr2
    label: "shot-10-dpr2: PAY-106 Running -> Needs you -> Allow once -> Running"
    segs: [{t_in: 0.20, t_out: 6.15, dur: 8.1355932}]       # flip at out 1.42 s, click 5.09 s, Running 5.50 s
    cam: [[0, 0.50, 0.70, 0.75], [end, 0.56, 0.82, 0.58]]
    cards: [{row: title, text: "...ONLY WHEN IT NEEDS YOU.", bars: [2, 6]}]
    contact_at: 4.5
    notes: "Card appears 1.3 s after 'Needs you' is on screen; no $ figure in this DPR2 frame."

  # ---- 44.75 s peak: hero UI montage (16 bars) ----
  - id: "13"
    beats: [132, 148]
    type: anime
    ui: true
    source: shot-12-dpr2-z179  # DPR 2 retake, no raw '**' (main 4ccfa5be); full width above the band (no pillars)
    label: "shot-12-dpr2-z179 (DPR 2): reviewer thread 'Approved. ...' for PR #432, full width"
    segs: [{t_in: 0.80, t_out: 5.45, dur: 5.4237288}]
    # src x 0-1856 (drops the 3 px border + sliver of the next pane at x >= 1858), y ~35-808 (Cursor tab -> 10:40 PM divider)
    cam: [[0, 0.48333, 0.3904, 0.96667]]
    ui_text:
      - [0.010, 0.435, 0.885, 0.466]     # reviewer's 'Approved. Cart summary uses the pricing engine matches the plan ...'
    named:
      - {name: "reviewer 'Approved.' line", box: [15, 468, 1700, 505]}
    cards: [{row: title, text: "REVIEWED, WITH THE REASON WHY.", bars: [0, 4]}]
    fx_in: {kind: flash, frames: 3}
    contact_at: 2.5
    notes: "Director v2 note 4: 'Approved. ...' and its reason read; card in the band, never over the line."
  - id: "14"
    beats: [148, 160]
    type: anime
    ui: true
    source: shot-16-prcard-tight   # DPR 2, 776x436.5 CSS clip (2.474x): PAY-110 PR card, badge Open -> Merged
    label: "shot-16-prcard-tight (DPR 2): PAY-110 pull request card, Open -> Merged"
    # Flip verified on the frames: Open at src frame 461, Merged at frame 462 = 7.700 s (the card itself only lays out
    # at frame 390 = 6.500 s, so start at 6.52). Flip lands at shot 1.17 s (out frame 1540), 6 frames before the 'MERGED.' card (bar 1 =
    # 1.356 s); real time to just after the flip, then the static Merged hold at 0.6x fills the 3 bars.
    segs: [{t_in: 6.52, t_out: 7.75, dur: 1.23}, {t_in: 7.75, t_out: 9.44, dur: 2.8366667}]
    # Gentle push 1.0x -> 1.05x landing on the flip, then hold. 1.05x is the most that keeps the WHOLE card in frame:
    # card outline src x 56-1866 (1811 px of 1920), y 386-692; crop at hold = src x 47-1876, y 158-920 (~9 px margins).
    # 1.1x would cut ~47 src px off each side of the card.
    cam: [[0, 0.5005, 0.50, 1.0], [1.18, 0.5005, 0.499, 0.95238], [end, 0.5005, 0.499, 0.95238]]
    named:                     # measured while 'MERGED.' is up
      - {name: "PR card title (PAY-110 Remove legacy pricing module)", box: [200, 480, 900, 530], t: 2.0}
      - {name: "PR badge 'Merged' (the flip)", box: [300, 415, 430, 470], t: 2.0}
      - {name: "PR card 'Builds pass · 1 approval' line", box: [200, 600, 1000, 660], t: 2.0}
    cards: [{row: title, text: "MERGED.", bars: [1, 3]}]     # no PR number on any card
    fx_in: {kind: flash, frames: 3}
    contact_at: 2.0
    notes: "PR number #438 is visible in the app frame (real UI), never in a card."
  - id: "15"
    beats: [160, 180]
    type: anime
    ui: true
    source: shot-11-all8       # visual only: all 8 cards Done in Landed. NOT the claim source (card text ~9-11 px)
    label: "shot-11-all8 (DPR 2): Landed column, all 8 cards Done, tilt down at 1.2x"
    segs: [{t_in: 0.10, t_out: 4.95, dur: 6.7796610}]
    cam: [[0, 0.5755, 0.309, 0.8333], [end, 0.5755, 0.691, 0.8333]]   # crop src x 305-1905; tilt y 0-667 -> 413-1080
    cards: [{row: title, text_from: claims.merged_count, bars: [1, 5]}]
    fx_in: {kind: flash, frames: 3}
    contact_at: 3.0
    notes: "Card text from claims.merged_count (shot11_legible = the shot-11 header take), never from this take's small text."
  - id: "16"
    beats: [180, 196]
    type: anime
    ui: true
    layout: full               # no card on this shot: full frame, no band
    source: shot-14b-dusk-r2
    label: "shot-14b-dusk-r2: dusk Outside with the 'Your workshop is now a Street' notice -> Street glide"
    # usable: 0-2.5 s and 3.6-7.5 s only (2.7-3.5 s collapse/re-expand flicker; 1.0-1.8 s settings popover). 3.6-7.45 s at
    # 0.71x: the notice reads alone on the dusk Outside, then Room view > Street (4.6 s) and the glide.
    segs: [{t_in: 3.60, t_out: 7.45, dur: 5.4237288}]
    cam: [[0, 0.5247, 0.516, 0.94]]      # header tab bar cropped (src y >= 50); notice (src x 1668-1898, y 108-186) in
    ui_text:
      - [0.865, 0.095, 0.992, 0.178]     # Street notice, top-right: never under a card
    contact_at: 1.0

  # ---- 66.44 s stop-time (drumless outro): freeze on the last Street frame, then morning
  - id: "17"
    beats: [196, 200]
    type: anime
    ui: true
    layout: full
    source: shot-14b-dusk-r2
    freeze: 7.45               # = shot 16's last source frame
    label: "Stop-time: freeze on the last Street frame of shot-14b-dusk-r2"
    cam: [[0, 0.5247, 0.516, 0.94]]
    ui_text:
      - [0.865, 0.095, 0.992, 0.178]
    contact_at: 0.6
  - id: "18"
    beats: [200, 212]
    type: anime
    ui: false
    source: shot-15-morning
    label: "shot-15 morning Workshop (07:00)"
    t_in: 0.25
    cam: [[0, 0.50, 0.57, 0.86], [end, 0.50, 0.56, 0.90]]
    cards: [{row: title, text: "GOOD MORNING.", bars: [0, 3]}]
    contact_at: 2.0
    notes: "Soft cut (no flash) in the drumless outro. Header bar cropped."

  # ---- 71.86 s final hit: end card (no web address)
  - id: "19"
    beats: [212, 224.76695]    # trimmed to the end of the music (76.192 s)
    type: anime
    ui: false
    source: shot-01-dusk
    freeze: 6.0
    label: "end card on the dusk Workshop (shot-01 also covers 17)"
    cam: [[0, 0.50, 0.56, 0.90], [end, 0.50, 0.56, 0.86]]
    bg: {blur: 6, dim: 0.55}
    cards:
      - {row: title, text: "commission-ai", bars: [0, end]}
      - {row: sub, text: "Your AI dev crew, on your Mac.", bars: [0, end]}
      - {row: tag, text: "macOS alpha", bars: [0, end]}
    fx_in: {kind: flash, frames: 3}
    contact_at: 2.0
    notes: "URL off (Marketing: no web address until Patrick picks)."

sfx: {library: {}}

mix:
  sr: 48000
  bus_db: {music: 0.0, sfx: -8.0, vo: 0.0}
  vo_line_lufs: -16.0
  duck: {db: 0.0, attack: 0.12, release: 0.35, pre: 0.12, post: 0.1}
  fade_out: 0.05
  masters:
    - {name: web, suffix: "", lufs: -14.0, ceiling: -1.5, max_true_peak: -1.0}

qa:
  lufs_tolerance: 0.5
  cut_markers: [intro_hit, lift, peak_start, seam_A_to_B_outro, final_hit]
