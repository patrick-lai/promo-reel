<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mod harness (plays the host)</title>
<style>
  :root { color-scheme: light dark; --bg: #e9e7e2; --fg: #1b1a17; --panel: #fff; --line: #d8d4ca; --acc: #b4531f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f0e0b; --fg: #e8e4da; --panel: #1b1914; --line: #34302a; --acc: #e58c55; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 13px/1.4 ui-sans-serif, -apple-system, system-ui, sans-serif; display: grid; grid-template-columns: 300px 1fr; }
  body.bare { display: block; }
  body.bare aside { display: none; }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 14px; overflow-y: auto; height: 100vh; display: grid; align-content: start; gap: 14px; }
  h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 6px; opacity: .65; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  button, select { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; cursor: pointer; }
  button:hover { border-color: var(--acc); }
  button[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); color: #fff; }
  label.chk { display: flex; gap: 6px; align-items: center; }
  .stage-list { display: grid; gap: 3px; }
  .stage-list button { text-align: left; display: flex; gap: 8px; justify-content: space-between; }
  .stage-list small { opacity: .6; }
  #log { font: 11.5px/1.4 ui-monospace, Menlo, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; max-height: 280px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
  #log div { padding: 2px 0; border-bottom: 1px dashed var(--line); }
  main { display: grid; place-items: center; height: 100vh; padding: 16px; min-width: 0; overflow: auto; }
  body.bare main { padding: 0; display: block; }
  #pane { height: calc(100vh - 32px); width: 520px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); box-shadow: 0 10px 40px -16px rgba(0,0,0,.4); flex: none; }
  body.bare #pane { width: 100vw; height: 100vh; border: 0; border-radius: 0; box-shadow: none; }
</style>
</head>
<body>
<aside>
  <div><h2>Stage</h2><div class="stage-list" id="stages"></div></div>
  <div><h2>Pane width</h2><div class="row" id="widths"></div></div>
  <div><h2>Host</h2>
    <div class="row" style="margin-bottom:8px"><button id="dark" aria-pressed="false">Dark</button><button id="reload">Reload mod</button></div>
    <label class="chk"><input type="checkbox" id="offline"> offline</label>
    <label class="chk"><input type="checkbox" id="readonly"> readonly (archived thread)</label>
    <label class="chk"><input type="checkbox" id="reduce"> reduce motion</label>
    <label class="chk"><input type="checkbox" id="hold"> hold state (loading)</label>
    <label class="chk"><input type="checkbox" id="mediaErr"> media requests fail</label>
    <label class="chk"><input type="checkbox" id="slow"> media 1.5 s slower</label>
    <label class="chk"><input type="checkbox" id="noPending"> host never reports pending</label>
  </div>
  <div><h2>Simulate</h2>
    <div class="row">
      <button id="bump">New version arrives</button>
      <button id="bumpGate">New version, step changed</button>
      <button id="respond">Agent responds</button>
    </div>
    <p style="opacity:.65;margin:6px 0 0">"Agent responds" clears pending and moves to the next stage. Version <b id="ver">0</b>.</p>
  </div>
  <div><h2>Bridge log</h2><div id="log" aria-live="polite"></div></div>
</aside>
<main><div id="pane"></div></main>
<script src="harness.js"></script>
</body>
</html>
