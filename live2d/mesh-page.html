<!doctype html>
<!-- promo-reel mesh avatar frame page (Mesh Avatar Studio runtime, npm `mesh-avatar`, MIT). Loaded by render.mjs from a
     localhost static server with job.page = "mesh-page.html"; never opened by hand. Same window.L2D contract as page.html:
     init(job) -> {width, height, missing, params, gl}, frame(i) -> {b64: bottom-up premultiplied RGBA, rb}. -->
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{position:absolute;left:0;top:0}</style>
<script>
  // Determinism as in page.html: seeded Math.random and a virtual clock, installed before the runtime loads.
  (function () {
    const q = new URLSearchParams(location.search);
    let state = (Number(q.get("seed")) || 1) >>> 0;
    Math.random = function () {
      state += 0x6D2B79F5;
      let v = state;
      v = Math.imul(v ^ v >>> 15, v | 1);
      v ^= v + Math.imul(v ^ v >>> 7, v | 61);
      return ((v ^ v >>> 14) >>> 0) / 4294967296;
    };
    window.__clockMs = 0;
    performance.now = () => window.__clockMs;
    Date.now = () => 1700000000000 + window.__clockMs;
  })();
</script>
</head><body>
<script type="module">
import { createMeshAvatar, PARAMS } from "/lib/mesh-avatar.js";

// Transparent margin around the picture on the canvas (share of its width / height), so a head turn or hair sway that
// moves pixels past the picture's edge is not clipped by the canvas.
const MARGIN = 0.08;
// Where the picture is cut flat (a bust ends at its bottom edge, often at the sides), the cut fades out over this share
// of the picture height instead of showing a hard line on the footage.
const FADE = 0.035;

window.L2D = {
  async init(job) {
    const W = job.width, H = job.height;
    const rig = await (await fetch("/avatar/rig.json")).json();
    const iw = rig.image.width, ih = rig.image.height;
    // Framing as page.html: the picture is `zoom` x H tall; normalised point at_x[0] / at_y[0] of it lands at
    // at_x[1] x W / at_y[1] x H. Legacy {zoom, cy, dx} = at_y [cy, 0.5], at_x [0.5, 0.5 + dx].
    const fr = job.frame, ay = fr.at_y || [fr.cy, 0.5], ax = fr.at_x || [0.5, 0.5 + (fr.dx || 0)];
    const s = (H * fr.zoom) / ih;
    const left = ax[1] * W - iw * s * ax[0], top = ay[1] * H - ih * s * ay[0];
    // The runtime fits the picture into its canvas (contain, bottom-anchored); padTop / padSide = MARGIN give exactly
    // MARGIN of empty canvas above and beside it: the canvas covers layer pixels [ox, ox + cw) x [oy, oy + chh).
    const cw = Math.round(iw * s * (1 + 2 * MARGIN)), chh = Math.round(ih * s * (1 + MARGIN));
    const canvas = document.createElement("canvas");
    canvas.style.width = `${cw}px`;
    canvas.style.height = `${chh}px`;
    document.body.appendChild(canvas);
    const av = await createMeshAvatar(canvas, { rig, assetsBase: "/avatar/built/", manual: true, padTop: MARGIN, padSide: MARGIN });
    av.setAutoIdle(false);
    av.setAutoMotion(false);
    const ox = left - MARGIN * iw * s, oy = top - MARGIN * ih * s;
    // Edge fade per layer column / row, from the picture rectangle in layer pixels. An edge at or past the layer's own
    // edge is not faded: the layer edge hides it (a bust framed with its cut on the panel bottom stays solid there).
    const band = Math.max(1, FADE * ih * s);
    const ramp = (d, inside) => (inside ? Math.min(1, Math.max(0, d / band)) : 1);
    const r = left + iw * s, b = top + ih * s;
    const fx = new Float32Array(W), fy = new Float32Array(H);
    for (let x = 0; x < W; x++) fx[x] = Math.min(ramp(x + 0.5 - left, left > 0.5), ramp(r - x - 0.5, r < W - 0.5));
    for (let y = 0; y < H; y++) fy[y] = Math.min(ramp(y + 0.5 - top, top > 0.5), ramp(b - y - 0.5, b < H - 0.5));
    const defaults = Object.fromEntries(PARAMS.map((p) => [p.id, p.def]));
    const known = new Set([...PARAMS.map((p) => p.id), "eyeSmileL"]);
    this.missing = Object.keys(job.values).filter((id) => !known.has(id));
    this.state = { job, av, canvas, defaults, ox: Math.round(ox), oy: Math.round(oy), fx, fy, W, H };
    // Settle hair physics on the first frame's pose with the frame index held at 0.
    this.apply(0);
    for (let i = 0; i < (job.warmup || 0); i++) av.advance(1 / job.fps, job.fps);
    window.__clockMs = 0;
    const gl = canvas.getContext("webgl2");
    return { width: iw, height: ih, missing: this.missing, params: PARAMS.length, gl: gl.getParameter(gl.VERSION) };
  },
  // Every runtime parameter is set every frame, so nothing the runtime would animate by itself (blink, idle motions,
  // finger taps) leaks in: the precomputed promo tracks are the whole performance.
  apply(i) {
    const st = this.state, v = {};
    for (const [id, arr] of Object.entries(st.job.values)) v[id] = arr[Math.min(i, arr.length - 1)];
    st.av.setParameters({ ...st.defaults, ...v }, 1);
  },
  async frame(i) {
    const st = this.state, { W, H, canvas } = st;
    this.apply(i);
    // A still (job.settle s) holds its pose until drawn eye / mouth cross-fades and hair have finished moving.
    const sec = 1 / st.job.fps + (st.job.settle || 0);
    window.__clockMs += 1000 * sec;
    st.av.advance(sec, st.job.fps);
    const rb = {};
    const p = st.av.getParameters();
    for (const id of st.job.readback || []) rb[id] = p[st.job.readbackMap[id]] ?? 0;
    // Read the layer window out of the (larger or smaller) canvas: premultiplied RGBA, bottom-up rows like page.html.
    const gl = canvas.getContext("webgl2"), cw = canvas.width, chh = canvas.height;
    const out = new Uint8Array(W * H * 4);
    const x0 = Math.max(0, st.ox), x1 = Math.min(W, st.ox + cw), y0 = Math.max(0, st.oy), y1 = Math.min(H, st.oy + chh);
    if (x1 > x0 && y1 > y0) {
      const w = x1 - x0, h = y1 - y0, px = new Uint8Array(w * h * 4);
      // GL rows count from the bottom: layer row y is canvas row (y - oy) from the top, GL row chh - 1 - (y - oy)
      gl.readPixels(x0 - st.ox, chh - (y1 - st.oy), w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
      for (let r = 0; r < h; r++) {
        const y = y1 - 1 - r, f = st.fy[y], dst = (H - 1 - y) * W * 4, src = r * w * 4;
        for (let c = 0; c < w; c++) {
          const k = f * st.fx[x0 + c], o = dst + (x0 + c) * 4, q = src + c * 4;
          if (k >= 1) { out[o] = px[q]; out[o + 1] = px[q + 1]; out[o + 2] = px[q + 2]; out[o + 3] = px[q + 3]; }
          else if (k > 0) { out[o] = px[q] * k; out[o + 1] = px[q + 1] * k; out[o + 2] = px[q + 2] * k; out[o + 3] = px[q + 3] * k; }
        }
      }
    }
    const url = await new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(new Blob([out])); });
    return { b64: url.slice(url.indexOf(",") + 1), rb };
  },
};
window.__ready = true;
</script>
</body></html>
